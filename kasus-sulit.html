<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0D6A66">
<meta name="description" content="100 soal kasus sulit UKOM DJP 2026 dengan pembahasan langsung.">
<meta name="robots" content="noindex, nofollow">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
<title>Kasus Sulit UKOM II</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,500;0,7..72,700;1,7..72,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Palet sama dengan Ruang Belajar UKOM: kertas dingin, tinta navy, stempel teal. */
:root{
  --paper:#F3F6F5;--sheet:#FFFFFF;--ink:#16243A;--ink-2:#4A5A70;--rule:#D5DEDD;
  --teal:#0D6A66;--teal-soft:#E0EFEC;--amber:#B97A10;--amber-soft:#FBF1DC;
  --red:#B2432A;--red-soft:#FBE8E2;--green:#2E7D4F;--green-soft:#E3F2E8;--blue:#2F5E9E;--blue-soft:#E4ECF6;
  --on-teal:#FFFFFF;
  --shadow:0 1px 2px rgba(22,36,58,.06),0 6px 24px rgba(22,36,58,.06);
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Literata",Georgia,"Times New Roman",serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Consolas,monospace;
  --top:56px;--bot:68px;
  --gl:max(16px,env(safe-area-inset-left,0px));--gr:max(16px,env(safe-area-inset-right,0px));
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0F161E;--sheet:#151F2A;--ink:#E4EAF0;--ink-2:#A3B1C2;--rule:#2A3746;
  --teal:#4FC3B8;--teal-soft:#16302F;--amber:#E7B04A;--amber-soft:#2F2614;
  --red:#F08A6E;--red-soft:#33201B;--green:#6BCB8E;--green-soft:#17291E;--blue:#8DB4EA;--blue-soft:#1A2636;
  --on-teal:#0B1A1A;--shadow:0 1px 2px rgba(0,0,0,.3),0 6px 24px rgba(0,0,0,.25);color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0F161E;--sheet:#151F2A;--ink:#E4EAF0;--ink-2:#A3B1C2;--rule:#2A3746;
  --teal:#4FC3B8;--teal-soft:#16302F;--amber:#E7B04A;--amber-soft:#2F2614;
  --red:#F08A6E;--red-soft:#33201B;--green:#6BCB8E;--green-soft:#17291E;--blue:#8DB4EA;--blue-soft:#1A2636;
  --on-teal:#0B1A1A;--shadow:0 1px 2px rgba(0,0,0,.3),0 6px 24px rgba(0,0,0,.25);color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.6;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--sheet);z-index:40}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}

/* ---------- bar atas ---------- */
.top{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;z-index:30;background:var(--sheet);border-bottom:1px solid var(--rule)}
.top .in{height:var(--top);display:flex;align-items:center;gap:12px;padding-left:var(--gl);padding-right:var(--gr);max-width:980px;margin:0 auto}
.brand{font-family:var(--f-display);font-weight:800;font-size:17px;letter-spacing:-.01em;white-space:nowrap;display:flex;align-items:center;gap:8px;min-width:0}
.brand .stamp{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:7px;background:var(--teal);color:var(--on-teal);font-size:13px;font-weight:800;flex:none}
.brand .sub{font-weight:500;color:var(--ink-2);font-size:14px}
.stats{margin-left:auto;display:flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:13px}
.pill{display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border-radius:999px;border:1px solid var(--rule);white-space:nowrap}
.pill.ok{color:var(--green);background:var(--green-soft);border-color:transparent}
.pill.no{color:var(--red);background:var(--red-soft);border-color:transparent}
.gridbtn .w{display:inline}
.gridbtn{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:9px;border:1px solid var(--rule);background:var(--paper);cursor:pointer;font-family:var(--f-display);font-weight:700;font-size:14px;white-space:nowrap}
.gridbtn:hover{border-color:var(--teal);color:var(--teal)}
.bar{height:3px;background:var(--rule)}
.bar i{display:block;height:100%;width:0;background:var(--teal);transition:width .3s}

/* ---------- isi ---------- */
main{max-width:760px;margin:0 auto;padding-top:calc(var(--top) + 3px + 22px);padding-bottom:calc(var(--bot) + 28px);padding-left:var(--gl);padding-right:var(--gr)}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;font-family:var(--f-display);font-size:13.5px;color:var(--ink-2);margin-bottom:12px}
.num{font-weight:800;font-size:15px;color:var(--ink)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;background:var(--teal-soft);color:var(--teal);font-weight:700}
.qtext{font-size:18px;line-height:1.68;margin:0 0 18px;text-wrap:pretty}
.opts{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.opt{width:100%;display:grid;grid-template-columns:34px 1fr 22px;gap:12px;align-items:start;text-align:left;padding:13px 14px;border-radius:12px;border:1.5px solid var(--rule);background:var(--sheet);cursor:pointer;line-height:1.5;font-size:16px;transition:border-color .15s,background .15s,opacity .2s;box-shadow:var(--shadow)}
.opt:hover:not([disabled]){border-color:var(--teal)}
.opt .k{display:grid;place-items:center;width:34px;height:34px;border-radius:9px;background:var(--paper);border:1px solid var(--rule);font-family:var(--f-display);font-weight:800;font-size:15px}
.opt .t{min-width:0;padding-top:5px}
.opt .ic{padding-top:6px;font-family:var(--f-display);font-weight:800;text-align:center}
.opt[disabled]{cursor:default}
.opt.dim{opacity:.55}
.opt.right{border-color:var(--green);background:var(--green-soft)}
.opt.right .k{background:var(--green);border-color:var(--green);color:var(--sheet)}
.opt.right .ic{color:var(--green)}
.opt.wrong{border-color:var(--red);background:var(--red-soft)}
.opt.wrong .k{background:var(--red);border-color:var(--red);color:var(--sheet)}
.opt.wrong .ic{color:var(--red)}

.verdict{margin:18px 0 0;padding:12px 16px;border-radius:12px;font-family:var(--f-display);font-weight:700;font-size:16px;display:flex;align-items:center;gap:10px;scroll-margin-top:calc(var(--top) + 16px)}
.verdict.ok{background:var(--green-soft);color:var(--green)}
.verdict.no{background:var(--red-soft);color:var(--red)}
.verdict .big{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:currentColor;flex:none}
.verdict .big b{color:var(--sheet);font-size:15px}
.verdict span.s{font-weight:500;color:var(--ink);font-size:15px}

.exp{margin-top:12px;background:var(--sheet);border:1px solid var(--rule);border-radius:14px;box-shadow:var(--shadow);overflow:hidden;animation:rise .28s ease-out}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.exp{animation:none}.bar i{transition:none}}
.exp .hd{padding:12px 18px;border-bottom:1px solid var(--rule);font-family:var(--f-display);font-weight:800;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--teal);background:var(--teal-soft)}
.exp .bd{padding:14px 18px 6px;font-size:16px;line-height:1.65}
.exp .bd p{margin:0 0 10px}
.exp .bd ul{margin:0 0 10px;padding-left:20px}
.exp .bd li{margin:0 0 4px}
.ref{margin:0;padding:6px 18px 16px;display:grid;grid-template-columns:auto 1fr;gap:10px 14px;font-size:15px;line-height:1.55;border-top:1px dashed var(--rule)}
.ref dt{font-family:var(--f-display);font-weight:700;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);padding-top:12px}
.ref dd{margin:0;padding-top:10px;min-width:0}
code.kw{font-family:var(--f-mono);font-size:14px;background:var(--amber-soft);color:var(--ink);padding:2px 7px;border-radius:6px;border:1px solid color-mix(in srgb,var(--amber) 35%,transparent);word-break:break-word}
.copy{margin-left:6px;padding:2px 8px;border-radius:6px;border:1px solid var(--rule);background:var(--paper);font-family:var(--f-display);font-size:12px;font-weight:700;cursor:pointer;vertical-align:1px}
.copy:hover{border-color:var(--teal);color:var(--teal)}
.crumbs{display:flex;flex-wrap:wrap;gap:4px 2px;align-items:center}
.crumbs span{padding:1px 0}
.crumbs .sep{color:var(--ink-2);padding:0 4px}
@media (max-width:520px){.ref{grid-template-columns:1fr;gap:0}.ref dd{padding-top:2px}}

/* ---------- bar bawah ---------- */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--sheet);border-top:1px solid var(--rule);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav .in{height:var(--bot);max-width:760px;margin:0 auto;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;padding-left:var(--gl);padding-right:var(--gr)}
.nb{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:46px;padding:0 16px;border-radius:12px;border:1.5px solid var(--rule);background:var(--sheet);font-family:var(--f-display);font-weight:700;font-size:15px;cursor:pointer;white-space:nowrap}
.nb:hover:not([disabled]){border-color:var(--teal);color:var(--teal)}
.nb[disabled]{opacity:.4;cursor:default}
.nb.next{justify-self:end;background:var(--teal);border-color:var(--teal);color:var(--on-teal)}
.nb.next:hover:not([disabled]){color:var(--on-teal);filter:brightness(1.08)}
.nb.prev{justify-self:start}
.pos{font-family:var(--f-mono);font-size:14px;color:var(--ink-2);text-align:center;background:none;border:0;cursor:pointer;padding:6px 8px;border-radius:8px}
.pos b{color:var(--ink);font-size:16px}
.pos:hover{background:var(--paper)}
.nb .s{display:none}
@media (max-width:440px){.nb{padding:0 14px}.nb .w{display:none}.nb .s{display:inline}.brand .sub{display:none}}
@media (max-width:360px){.pill.no{display:none}}

/* ---------- lembar daftar soal ---------- */
.scrim{position:fixed;inset:0;background:rgba(10,18,28,.45);z-index:50}
.sheet{position:fixed;z-index:51;left:50%;transform:translateX(-50%);bottom:0;width:min(760px,100%);max-height:86vh;overflow:auto;background:var(--sheet);border-radius:18px 18px 0 0;box-shadow:0 -10px 40px rgba(0,0,0,.2);padding:18px var(--gr) calc(22px + env(safe-area-inset-bottom,0px)) var(--gl)}
.sheet h2{font-family:var(--f-display);font-weight:800;font-size:20px;margin:0;letter-spacing:-.01em}
.sheet .lead{margin:4px 0 14px;color:var(--ink-2);font-size:14.5px}
.sh-top{display:flex;align-items:flex-start;gap:12px}
.x{margin-left:auto;width:36px;height:36px;border-radius:10px;border:1px solid var(--rule);background:var(--paper);cursor:pointer;font-size:18px;line-height:1;flex:none}
.score{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:0 0 16px}
.score div{border:1px solid var(--rule);border-radius:12px;padding:10px 12px;min-width:0}
.score b{display:block;font-family:var(--f-display);font-size:24px;font-weight:800;line-height:1.1}
.score span{font-size:12.5px;color:var(--ink-2);font-family:var(--f-display)}
.score .g b{color:var(--green)}.score .r b{color:var(--red)}
.babh{display:flex;align-items:baseline;gap:8px;margin:14px 0 8px;font-family:var(--f-display);font-size:14px}
.babh{flex-wrap:wrap}
.babh b{font-weight:800;white-space:nowrap}
.babh em{font-style:normal;color:var(--ink-2);margin-left:auto;font-family:var(--f-mono);font-size:12.5px}
.cells{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:6px}
.cell{aspect-ratio:1;max-width:100%;border-radius:9px;border:1.5px solid var(--rule);background:var(--paper);font-family:var(--f-mono);font-size:13px;font-weight:600;cursor:pointer;display:grid;place-items:center;padding:0}
.cell.ok{background:var(--green-soft);border-color:var(--green);color:var(--green)}
.cell.no{background:var(--red-soft);border-color:var(--red);color:var(--red)}
.cell.cur{outline:2.5px solid var(--teal);outline-offset:1px}
.legend{display:flex;flex-wrap:wrap;gap:14px;margin:16px 0 0;font-size:13px;color:var(--ink-2);font-family:var(--f-display)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px;border:1.5px solid var(--rule);background:var(--paper)}
.legend .lo{background:var(--green-soft);border-color:var(--green)}.legend .ln{background:var(--red-soft);border-color:var(--red)}
.reset{margin-top:18px;padding-top:14px;border-top:1px solid var(--rule);display:flex;flex-wrap:wrap;gap:10px;align-items:center;font-size:14px;color:var(--ink-2)}
.reset button{padding:8px 14px;border-radius:10px;border:1px solid var(--rule);background:var(--paper);cursor:pointer;font-family:var(--f-display);font-weight:700;font-size:14px}
.reset button.danger{border-color:var(--red);color:var(--red);background:var(--red-soft)}
.keys{margin-top:10px;font-size:13px;color:var(--ink-2)}
.keys kbd{font-family:var(--f-mono);font-size:12px;border:1px solid var(--rule);border-bottom-width:2px;border-radius:5px;padding:0 5px;background:var(--paper)}
@media (max-width:520px){body{font-size:16px}.qtext{font-size:16.5px;line-height:1.62}.opt{font-size:15px;padding:12px;gap:10px;grid-template-columns:30px 1fr 18px}.opt .k{width:30px;height:30px;font-size:14px}.opt .t{padding-top:3px}.opt .ic{padding-top:4px}.exp .bd{font-size:15.5px}}
@media (max-width:520px){.babh em{margin-left:0;flex-basis:100%}}
@media (max-width:420px){.cells{gap:5px}.cell{font-size:12px;border-radius:7px}.score b{font-size:20px}}
</style>

</head>
<body>
<header class="top">
  <div class="in">
    <div class="brand"><span class="stamp">II</span>Kasus Sulit <span class="sub">UKOM DJP 2026</span></div>
    <div class="stats">
      <span class="pill ok" title="Benar">✓ <b id="nOk">0</b></span>
      <span class="pill no" title="Salah">✕ <b id="nNo">0</b></span>
    </div>
    <button class="gridbtn" id="openGrid" aria-haspopup="dialog">▦ <span class="w">Soal</span></button>
  </div>
  <div class="bar"><i id="barFill"></i></div>
</header>

<main id="main" aria-live="polite"></main>

<nav class="nav" aria-label="Navigasi soal">
  <div class="in">
    <button class="nb prev" id="prev">← <span class="w">Sebelumnya</span><span class="s">Kembali</span></button>
    <button class="pos" id="pos" aria-label="Buka daftar soal"><b id="posN">1</b> / <span id="posT">100</span></button>
    <button class="nb next" id="next"><span class="w" id="nextW">Berikutnya</span><span class="s" id="nextS">Lanjut</span> →</button>
  </div>
</nav>

<div class="scrim" id="scrim" hidden></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="shT" hidden></section>

<script>
(function(){
"use strict";
const Q = [{"b": 1, "q": "Omzet CV Mentari melewati Rp4,8 miliar pada Oktober 2024, tetapi CV Mentari tidak melaporkan usahanya sampai akhir tahun buku. DJP baru mengukuhkannya sebagai PKP secara jabatan pada Agustus 2025. Selama Januari–Juli 2025, CV Mentari tidak membuat Faktur Pajak, tetapi memiliki faktur pembelian lengkap dengan PPN dari pemasoknya. Bagaimana perlakuan PPN untuk penyerahan Januari–Juli 2025?", "o": ["PK dihitung dari harga jual, PM sesuai faktur pembelian asli, dan dikenai denda 1% karena tidak membuat faktur", "PPN baru terutang sejak SPPKP Agustus 2025, sehingga penyerahan Januari–Juli 2025 tidak dipungut", "PK dihitung dari harga jual, PM diganti pedoman 80% dari PK, dan tidak dikenai denda 1% Pasal 14 ayat (4)", "PK dihitung dengan DPP nilai lain, PM diganti pedoman 80% dari PK, dan dikenai denda 1% DPP"], "a": 2, "e": "Kewajiban PPN CV Mentari seharusnya sudah dimulai 1 Januari 2025. Untuk masa sebelum pengukuhan:\n- PK dihitung dari harga jual/penggantian (tidak boleh nilai lain atau besaran tertentu).\n- PM diganti pedoman 80% × PK, sehingga yang disetor 20%. PPN di faktur pembelian asli tidak dapat dikreditkan, dibiayakan, atau dikapitalisasi.\n- Pengusaha yang belum PKP tidak kena denda 1% Pasal 14 ayat (4), tetapi tetap bisa kena denda telat lapor, bunga, dan/atau kenaikan.", "s": "Slide 559–566 (ilustrasi slide 562)", "kw": "pedoman pengkreditan", "rk": 1, "hit": "Bab 1 · 4.6 Pengkreditan Pajak Masukan", "nav": ["Beranda", "Bab 1", "Modul 4 · PPN", "Pelajaran 4.6 “Pengkreditan Pajak Masukan”", "bagian “Empat situasi khusus”, subbagian “PM sebelum pengusaha dikukuhkan PKP”"]}, {"b": 1, "q": "Tuan Harun meninggal dunia dan meninggalkan rumah serta deposito yang belum dibagi kepada ahli warisnya. Saat itu masih ada keberatan atas SKPKB PPh Tuan Harun yang sedang diproses. Salah satu ahli waris mengajukan penghapusan NPWP almarhum sebulan setelah pemakaman. Bagaimana penilaian yang paling tepat?", "o": ["Dapat dihapus, karena WP orang pribadi yang meninggal dunia selalu memenuhi kriteria penghapusan", "Dapat dihapus, asalkan ahli waris melampirkan akta kematian dan surat pernyataan ahli waris", "Belum dapat dihapus hanya karena keberatan, sedangkan status warisan tidak memengaruhi penghapusan", "Belum dapat dihapus, karena warisan belum terbagi dan masih ada keberatan yang sedang diproses"], "a": 3, "e": "Kriteria penghapusan NPWP orang pribadi adalah meninggal dunia dan tidak meninggalkan warisan. Kalau ada warisan belum terbagi, warisan itu menjadi subjek pajak pengganti, dan NPWP-nya baru dapat dihapus setelah warisan selesai dibagi. Selain kriteria, ada syarat tambahan: WP tidak sedang menempuh upaya administratif atau hukum, termasuk keberatan. Kedua hambatan berlaku sekaligus.", "s": "Slide 249–273", "kw": "syarat tambahan penghapusan", "rk": 1, "hit": "Bab 1 · 1.2 Perubahan data, WP Nonaktif, dan penghapusan NPWP", "nav": ["Beranda", "Bab 1", "Modul 1 · KUP: Kewajiban Dasar WP", "Pelajaran 1.2 “Perubahan data, WP Nonaktif, dan penghapusan NPWP”", "bagian “Penghapusan NPWP”, subbagian “Kriteria” dan “Syarat tambahan”"]}, {"b": 1, "q": "Bendahara sebuah satker memotong PPh 21 dan menyetorkannya melalui potongan SPM dalam rangka pelaksanaan APBN. SPM diajukan tanggal 12, SP2D terbit tanggal 16, dan dana diterima rekening kas negara tanggal 17. Menurut PMK-81/2024, tanggal yang diakui sebagai tanggal pembayaran pajak tersebut adalah …", "o": ["Tanggal 12, yaitu tanggal pengajuan SPM", "Tanggal 17, yaitu tanggal dana masuk kas negara", "Tanggal validasi NTPN yang dicetak pada BPN", "Tanggal 16, yaitu tanggal terbit SP2D"], "a": 3, "e": "PMK-81/2024 kini mengakui SP2D sebagai sarana bayar yang sah, dengan syarat divalidasi sistem perbendaharaan dan anggaran negara. Tanggal yang diakui adalah tanggal terbit SP2D, untuk pembayaran dalam rangka pelaksanaan APBN. Aturan lama tidak mengatur SP2D.", "s": "Slide 21–26", "kw": "SP2D sarana pembayaran", "rk": 1, "hit": "Bab 1 · 1.5 Membayar pajak: sarana, tanggal bayar, jatuh tempo", "nav": ["Beranda", "Bab 1", "Modul 1 · KUP: Kewajiban Dasar WP", "Pelajaran 1.5 “Membayar pajak: sarana, tanggal bayar, jatuh tempo”", "bagian “Bagaimana pajak dibayar sekarang?”, subbagian “Sarana pembayaran yang sah”"]}, {"b": 1, "q": "PT Rimbun memperoleh SKPLB. Setelah diperhitungkan dengan utang pajaknya, masih ada sisa kelebihan bayar, dan atas persetujuannya sisa itu dipakai untuk mengisi deposit pajak. Dua bulan kemudian PT Rimbun ingin memakai deposit itu untuk membayar PPh Pasal 25. Pernyataan yang tepat adalah …", "o": ["Deposit diakui pada tanggal SKPLB terbit, dan PPh 25 otomatis terlunasi tanpa tindakan WP", "Deposit diakui pada tanggal terbit SKPKPP, dan pelunasan PPh 25 dilakukan dengan pemindahbukuan", "Deposit diakui pada tanggal persetujuan WP, dan PPh 25 harus dibayar ulang dengan kode billing", "Deposit diakui pada tanggal SP2D, dan deposit hanya dapat dimintakan kembali, tidak dapat dipakai"], "a": 1, "e": "Deposit pajak adalah pembayaran yang belum dialokasikan ke kewajiban tertentu. Tanggal pengakuannya bergantung pada cara pengisian: pembayaran elektronik pada tanggal BPN, pemindahbukuan pada tanggal bukti Pbk, dan sisa kelebihan bayar atau imbalan bunga pada tanggal terbit SKPKPP. Saldo deposit dipakai untuk kewajiban tertentu melalui pemindahbukuan.", "s": "Slide 21–26, 305–317", "kw": "deposit pajak", "rk": 1, "hit": "Bab 1 · 1.5 Membayar pajak: sarana, tanggal bayar, jatuh tempo", "nav": ["Beranda", "Bab 1", "Modul 1 · KUP: Kewajiban Dasar WP", "Pelajaran 1.5 “Membayar pajak: sarana, tanggal bayar, jatuh tempo”", "bagian “Deposit pajak”"]}, {"b": 1, "q": "Hasil pemeriksaan menerbitkan SKPKB PPh Badan untuk PT Lazuardi, lengkap dengan sanksi bunganya. PT Lazuardi tidak keberatan, tetapi baru melunasi SKPKB itu tiga bulan setelah jatuh tempo. Atas keterlambatan pelunasan tersebut, sanksi bunga yang dikenakan memakai uplift factor …", "o": ["20%, karena pokok utangnya berasal dari SKPKB PPh Badan tahunan", "0%, karena keterlambatan melunasi ketetapan dikenai bunga Pasal 19", "15%, karena pokok utangnya berasal dari SKPKB hasil pemeriksaan", "5%, karena perlakuannya sama dengan terlambat membayar kurang bayar SPT"], "a": 1, "e": "Bedakan dua bunga. Bunga di dalam SKPKB (Pasal 13) memakai uplift 15% atau 20%. Tetapi kalau SKPKB itu terlambat dilunasi setelah jatuh tempo, keterlambatan tersebut dikenai bunga Pasal 19 dengan uplift 0%, dihitung dari jatuh tempo sampai tanggal bayar.", "s": "Slide 316–332", "kw": "uplift", "rk": 2, "hit": "Bab 1 · 1.6 Sanksi bunga, angsuran/penundaan, dan pemindahbukuan", "nav": ["Beranda", "Bab 1", "Modul 1 · KUP: Kewajiban Dasar WP", "Pelajaran 1.6 “Sanksi bunga, angsuran/penundaan, dan pemindahbukuan”", "bagian “Sanksi bunga: rumus dasarnya”"]}, {"b": 1, "q": "PT Bening sudah melaporkan SPT Tahunan PPh Badan dengan status kurang bayar sebulan sebelum batas waktu, tetapi PPh 29-nya belum dilunasi karena kesulitan likuiditas. Seminggu kemudian, masih sebelum batas waktu SPT, PT Bening mengajukan permohonan mengangsur PPh 29 tersebut. Penilaian yang tepat adalah …", "o": ["Dapat dikabulkan, karena permohonan masih diajukan sebelum batas waktu penyampaian SPT", "Dapat dikabulkan paling lama 24 bulan, karena alasannya kesulitan likuiditas yang nyata", "Tidak dapat, karena permohonan harus diajukan sebelum SPT Tahunan disampaikan", "Dapat dikabulkan tanpa jaminan apa pun, karena PPh 29 bukan merupakan ketetapan pajak"], "a": 2, "e": "Untuk PPh 29, permohonan angsuran/penundaan harus disampaikan sebelum batas waktu dan sebelum SPT Tahunan disampaikan. Jangkanya paling lama sampai batas waktu SPT tahun berikutnya, keputusan 3 HK, dan jaminannya berupa dokumen aset berwujud. Jangka 24 bulan berlaku untuk ketetapan, bukan PPh 29.", "s": "Slide 316–332", "kw": "angsuran PPh 29", "rk": 2, "hit": "Bab 1 · 1.6 Sanksi bunga, angsuran/penundaan, dan pemindahbukuan", "nav": ["Beranda", "Bab 1", "Modul 1 · KUP: Kewajiban Dasar WP", "Pelajaran 1.6 “Sanksi bunga, angsuran/penundaan, dan pemindahbukuan”", "bagian “Mengangsur atau menunda pembayaran (Pasal 9 ayat 4)”"]}, {"b": 1, "q": "PT Senja menghentikan seluruh pegawainya pada Maret dan sejak April tidak lagi membayar penghasilan apa pun kepada orang pribadi sampai akhir tahun. Direkturnya berpendapat SPT Masa PPh 21/26 April–Desember yang nihil tidak perlu dilaporkan sama sekali. Pendapat itu …", "o": ["Benar, karena SPT Masa PPh 21/26 yang nihil tidak wajib dilaporkan untuk masa mana pun", "Keliru, karena seluruh SPT Masa PPh 21/26 nihil tetap wajib dilaporkan setiap bulannya", "Keliru sebagian: SPT Masa PPh 21/26 Desember tetap wajib dilaporkan walau nihil", "Benar, asalkan PT Senja menyampaikan pemberitahuan tertulis penghentian pegawai ke KPP"], "a": 2, "e": "SPT Masa PPh 21/26 nihil tidak wajib dilaporkan, kecuali Masa Desember (atau masa terakhir, misalnya saat pegawai tetap berhenti). Masa terakhir tetap wajib dilaporkan karena di situlah penghitungan setahun dan bukti potong tahunan disusun.", "s": "Slide 33–42, 366–384", "kw": "Masa Desember", "rk": 1, "hit": "Bab 1 · 1.7 Melaporkan pajak: SPT, isi, bentuk, dan batas waktu", "nav": ["Beranda", "Bab 1", "Modul 1 · KUP: Kewajiban Dasar WP", "Pelajaran 1.7 “Melaporkan pajak: SPT, isi, bentuk, dan batas waktu”", "bagian “Batas waktu penyampaian SPT”, subbagian “Tidak wajib dilaporkan”"]}, {"b": 1, "q": "DJP sedang melakukan pemeriksaan bukti permulaan atas PT Kaliandra, tetapi secara tertutup sehingga PT Kaliandra, pengurus, dan pegawainya belum diberi tahu. Belum ada pemeriksaan untuk menguji kepatuhan. PT Kaliandra lalu membetulkan SPT Tahunan yang membuat pajaknya bertambah. Bagaimana status pembetulan itu?", "o": ["Tidak dapat dilakukan, karena bukper dalam bentuk apa pun menutup hak WP membetulkan SPT", "Tidak dapat dilakukan, karena pembetulan yang menambah pajak harus menunggu bukper selesai", "Masih dapat dilakukan, tetapi bunganya memakai uplift 10% karena WP sedang dalam bukper", "Masih dapat, karena yang menghalangi hanya pemeriksaan atau bukper yang dilakukan terbuka"], "a": 3, "e": "Pasal 8: WP boleh membetulkan SPT selama DJP belum melakukan pemeriksaan, atau pemeriksaan bukti permulaan secara terbuka kepada WP, wakil, kuasa, pegawai, atau anggota keluarga yang telah dewasa. Bukper yang masih tertutup tidak menghalangi. Pembetulan yang menambah pajak kena bunga acuan + 5%.", "s": "Slide 385–396", "kw": "bukti permulaan secara terbuka", "rk": 1, "hit": "Bab 1 · 1.8 Denda telat lapor, SPT ditolak, perpanjangan, dan pembetulan SPT", "nav": ["Beranda", "Bab 1", "Modul 1 · KUP: Kewajiban Dasar WP", "Pelajaran 1.8 “Denda telat lapor, SPT ditolak, perpanjangan, dan pembetulan SPT”", "bagian “Pembetulan SPT oleh WP sendiri (Pasal 8)”"]}, {"b": 1, "q": "Mr. Tanaka, WNA yang sebelumnya bekerja di Jakarta, kembali ke Jepang pada Mei dan sejak itu tidak lagi berada di Indonesia lebih dari 183 hari dalam 12 bulan. Ia tidak menyampaikan SPT Tahunan untuk tahun tersebut. KPP menerbitkan STP denda Rp100.000. Bagaimana penilaian yang tepat?", "o": ["Tidak tepat, karena WNA yang tidak lagi berada di Indonesia dikecualikan dari denda", "Tepat, karena setiap SPT Tahunan orang pribadi yang tidak disampaikan didenda Rp100.000", "Tepat, tetapi besarnya seharusnya Rp1.000.000 karena WP tersebut berstatus WNA", "Tidak tepat, karena WNA sejak awal tidak pernah wajib menyampaikan SPT Tahunan"], "a": 0, "e": "Denda Pasal 7 tidak dikenakan kepada beberapa pihak, antara lain OP yang meninggal tanpa warisan belum terbagi, OP yang sudah tidak berusaha, WNA yang tidak tinggal lagi di Indonesia atau tidak berada di Indonesia lebih dari 183 hari dalam 12 bulan, BUT yang tidak beroperasi lagi, dan WP yang terkena bencana.", "s": "Slide 43–50", "kw": "tidak dikenakan denda", "rk": 1, "hit": "Bab 1 · 1.8 Denda telat lapor, SPT ditolak, perpanjangan, dan pembetulan SPT", "nav": ["Beranda", "Bab 1", "Modul 1 · KUP: Kewajiban Dasar WP", "Pelajaran 1.8 “Denda telat lapor, SPT ditolak, perpanjangan, dan pembetulan SPT”", "bagian “Denda telat atau tidak lapor (Pasal 7 ayat 1 UU KUP)”"]}, {"b": 1, "q": "Saat diperiksa, sebuah bank menolak memperlihatkan data rincian kredit debiturnya dengan alasan rahasia bank. Pembukuannya diselenggarakan secara elektronik, tetapi bank hanya bersedia memberikan cetakan kertas. Permintaan pemeriksa sudah lewat tiga minggu. Mana pernyataan yang paling tepat?", "o": ["Rahasia bank ditiadakan untuk pemeriksaan; WP wajib memberi akses atau unduhan data", "Rahasia bank sah sebagai alasan, tetapi WP wajib memberi akses data elektronik dalam 1 bulan", "Rahasia bank ditiadakan, tetapi cetakan kertas sudah cukup memenuhi kewajiban pembukuan elektronik", "Bank boleh menunda sampai ada izin OJK, dan jangka 1 bulan baru dihitung sejak izin itu terbit"], "a": 0, "e": "Pasal 29 ayat (4): kewajiban merahasiakan (termasuk rahasia bank atau jabatan) ditiadakan untuk pemeriksaan. Kalau pembukuan dikelola secara elektronik, WP wajib memberi akses dan/atau kesempatan mengunduh data. Semua kewajiban dipenuhi paling lama 1 bulan sejak permintaan (Pasal 29 ayat 3a).", "s": "Slide 51–64", "kw": "kerahasiaan", "rk": 1, "hit": "Bab 1 · 2.1 Pemeriksaan pajak dalam UU KUP", "nav": ["Beranda", "Bab 1", "Modul 2 · KUP: Ketika DJP Menguji, Menetapkan, Menagih", "Pelajaran 2.1 “Pemeriksaan pajak dalam UU KUP”", "bagian “Kewajiban WP yang diperiksa (Pasal 29 UU KUP, PP 50/2022)”"]}, {"b": 1, "q": "PT Arka tidak memperlihatkan pembukuannya selama pemeriksaan, sehingga penghasilan kena pajaknya dihitung secara jabatan. Saat PAHP, PT Arka baru membawa ratusan bukti biaya operasional dan meminta semuanya diperhitungkan. Bagaimana perlakuan yang paling tepat?", "o": ["Seluruh bukti biaya wajib dipertimbangkan, karena WP tetap punya hak hadir dalam PAHP", "Hanya dokumen untuk menghitung peredaran atau penghasilan bruto dan dokumen kredit pajak", "Tidak satu pun dokumen dapat dipertimbangkan, karena WP sejak awal tidak kooperatif", "Bukti biaya tetap dipertimbangkan, asalkan disertai surat pernyataan tanggung jawab direksi"], "a": 1, "e": "Kalau penghasilan kena pajak dihitung secara jabatan, hak WP tetap dijaga: DJP wajib menyampaikan SPHP dan memberi hak hadir PAHP. Tetapi dokumen yang dipertimbangkan terbatas pada dokumen untuk menghitung peredaran usaha atau penghasilan bruto (untuk menghitung neto secara jabatan) dan dokumen kredit pajak.", "s": "Slide 51–64", "kw": "penghitungan penghasilan secara jabatan", "rk": 1, "hit": "Bab 1 · 2.1 Pemeriksaan pajak dalam UU KUP", "nav": ["Beranda", "Bab 1", "Modul 2 · KUP: Ketika DJP Menguji, Menetapkan, Menagih", "Pelajaran 2.1 “Pemeriksaan pajak dalam UU KUP”", "bagian “Kalau WP tidak kooperatif”, subbagian “Penghitungan penghasilan secara jabatan”"]}, {"b": 1, "q": "PT Pionir Jaya adalah PKP yang belum pernah melakukan penyerahan. PT Pionir Jaya mengkreditkan Pajak Masukan dan mengompensasikan lebih bayarnya dari masa ke masa, tanpa meminta restitusi. Pemeriksaan menyimpulkan pengkreditan itu tidak berhak. Ketetapan dan sanksi yang tepat adalah …", "o": ["SKPKB dengan kenaikan 100% karena dianggap pengembalian pendahuluan", "SKPKB dengan bunga (acuan + 15%)/12 per bulan, paling lama 24 bulan", "STP dengan denda 1% DPP karena tidak ada penyerahan", "SKPKBT dengan kenaikan 100% karena data baru"], "a": 1, "e": "SKPKB terbit antara lain kalau PKP tidak melakukan penyerahan atau ekspor tetapi sudah mengkreditkan atau menerima pengembalian PM. Sanksinya bunga Pasal 13 ayat (2)/(2b), yaitu acuan + 15%. Kenaikan 100% hanya untuk SKPKBT dan WP yang tidak berhak atas pengembalian pendahuluan. Denda 1% DPP untuk faktur yang tidak dibuat atau tidak lengkap.", "s": "Slide 65–76", "kw": "SKPKB", "rk": 1, "hit": "Bab 1 · 2.2 Ketetapan pajak, STP, dan ringkasan sanksi", "nav": ["Beranda", "Bab 1", "Modul 2 · KUP: Ketika DJP Menguji, Menetapkan, Menagih", "Pelajaran 2.2 “Ketetapan pajak, STP, dan ringkasan sanksi”", "bagian “SKPKB (Pasal 13 ayat 1)”"]}, {"b": 1, "q": "SKPKB PT Garuda baru terbit dua minggu lalu dan belum jatuh tempo. DJP mendapat informasi bahwa direktur utamanya, selaku penanggung pajak, akan pindah ke luar negeri dan sedang menjual aset-aset perusahaan. Tindakan yang dapat dilakukan DJP sekarang adalah …", "o": ["Menunggu jatuh tempo, lalu menerbitkan Surat Teguran 7 hari kemudian", "Menerbitkan Surat Perintah Penagihan Seketika dan Sekaligus", "Langsung melakukan penyanderaan karena penanggung pajak akan pergi", "Menerbitkan Surat Paksa sekarang tanpa didahului tindakan penagihan apa pun"], "a": 1, "e": "SPPSS memungkinkan penagihan sebelum jatuh tempo, misalnya kalau penanggung pajak akan meninggalkan Indonesia, memindahtangankan barangnya, ada tanda badan akan bubar atau pailit, daluwarsa kurang dari 2 tahun, atau ada tanda perubahan bentuk badan. Penyanderaan adalah upaya paling akhir.", "s": "Slide 77–85", "kw": "seketika dan sekaligus", "rk": 1, "hit": "Bab 1 · 2.3 Penagihan pajak", "nav": ["Beranda", "Bab 1", "Modul 2 · KUP: Ketika DJP Menguji, Menetapkan, Menagih", "Pelajaran 2.3 “Penagihan pajak”", "bagian “Urutan tindakan penagihan”, tindakan khusus “SPPSS”"]}, {"b": 1, "q": "PT Cendana menerima SKPKB dari pemeriksaan yang ternyata tidak pernah didahului penyampaian SPHP. Permohonan pembatalan SKPKB atas dasar itu sudah diajukan dan ditolak. Kini PT Cendana ingin mengajukan permohonan kedua dengan alasan yang sama. Bagaimana kedudukannya?", "o": ["Dapat, asalkan permohonan kedua diajukan dalam 3 bulan sejak keputusan pertama", "Dapat, karena semua permohonan Pasal 36 ayat (1) boleh diajukan paling banyak 2 kali", "Tidak dapat, karena sejak awal jalurnya harus keberatan Pasal 25, bukan Pasal 36", "Tidak dapat, karena pembatalan SKP tanpa SPHP hanya dapat diajukan 1 kali"], "a": 3, "e": "Pasal 36 ayat (1) huruf a–c (sanksi, SKP tidak benar, STP tidak benar) dapat diajukan paling banyak 2 kali, permohonan kedua dalam 3 bulan. Huruf d, yaitu pembatalan SKP hasil pemeriksaan tanpa SPHP atau tanpa pembahasan akhir, hanya 1 kali.", "s": "Slide 86–92", "kw": "tanpa SPHP", "rk": 1, "hit": "Bab 1 · 2.4 Peta upaya hukum, pembetulan Pasal 16, dan Pasal 36", "nav": ["Beranda", "Bab 1", "Modul 2 · KUP: Ketika DJP Menguji, Menetapkan, Menagih", "Pelajaran 2.4 “Peta upaya hukum, pembetulan Pasal 16, dan Pasal 36”", "bagian “Pengurangan dan pembatalan (Pasal 36 ayat 1)”"]}, {"b": 1, "q": "Dalam SKPKB PPh orang pribadi milik Tuan Bayu, pemeriksa memakai PTKP status TK/0, padahal sejak awal tahun ia sudah kawin dan punya dua anak tanggungan. Tidak ada sengketa lain atas koreksi pemeriksaan. Jalur yang paling tepat dan efisien adalah …", "o": ["Keberatan Pasal 25, karena jumlah pajak dalam SKPKB berubah", "Gugatan Pasal 23, karena SKPKB diterbitkan dengan prosedur yang keliru", "Pembetulan Pasal 16, karena termasuk kekeliruan penerapan ketentuan tertentu (PTKP)", "Pengurangan Pasal 36, karena SKPKB yang tidak benar hanya bisa dikurangi lewat Pasal 36"], "a": 2, "e": "Pembetulan Pasal 16 mencakup salah tulis, salah hitung, dan kekeliruan penerapan ketentuan tertentu, yaitu tarif, persentase NPPN, sanksi administrasi, PTKP, penghitungan PPh tahun berjalan, dan pengkreditan pajak. Pembetulan bisa berkali-kali dan diputus paling lama 6 bulan.", "s": "Slide 86–92", "kw": "kekeliruan penerapan", "rk": 1, "hit": "Bab 1 · 2.4 Peta upaya hukum, pembetulan Pasal 16, dan Pasal 36", "nav": ["Beranda", "Bab 1", "Modul 2 · KUP: Ketika DJP Menguji, Menetapkan, Menagih", "Pelajaran 2.4 “Peta upaya hukum, pembetulan Pasal 16, dan Pasal 36”", "bagian “Pembetulan (Pasal 16 UU KUP)”, subbagian “Apa yang bisa dibetulkan”"]}, {"b": 1, "q": "Keberatan PT Asoka atas SKPKB ditolak seluruhnya. PT Asoka lalu mengajukan banding, dan Putusan Banding juga menolak seluruhnya. Sanksi denda yang dikenakan atas sengketa ini adalah …", "o": ["Denda 30% berdasarkan SK Keberatan ditambah denda 60% berdasarkan Putusan Banding", "Denda 30% saja, karena keberatan adalah upaya pertama", "Denda 60% berdasarkan Putusan Banding, tanpa denda 30% keberatan", 2.6 “Kelebihan bayar, restitusi, dan imbalan bunga”", "bagian “Alur uang sampai ke rekening”"]}, {"b": 1, "q": "Penyelenggara PMSE luar negeri yang ditunjuk sebagai Pihak Lain pemungut PPN tidak menyetorkan PPN yang dipungutnya meskipun sudah ditegur. Langkah sanksi yang sesuai ketentuan adalah …", "o": ["Pemutusan akses atas permintaan Menkeu, lalu normalisasi setelah patuh", "Pencabutan penunjukan sebagai Pihak Lain dan pengalihan kewajiban ke konsumen", "Pemutusan akses langsung oleh DJP sendiri tanpa didahului teguran apa pun", "Penyanderaan perwakilan PMSE di Indonesia sebagai langkah penagihan pertama"], "a": 0, "e": "Pihak Lain yang tidak patuh dapat ditetapkan, ditagih, dan dikenai sanksi seperti WP biasa. Kalau ia penyelenggara sistem elektronik, sanksinya bertahap: teguran, lalu pemutusan akses oleh menteri bidang komunikasi dan informatika atas permintaan Menkeu, lalu normalisasi akses setelah patuh.", "s": "Slide 101–104, 228–239", "kw": "pemutusan akses", "rk": 1, "hit": "Bab 1 · 2.7 Wakil, kuasa, dan pihak lain sebagai pemotong/pemungut", "nav": ["Beranda", "Bab 1", "Modul 2 · KUP: Ketika DJP Menguji, Menetapkan, Menagih", "Pelajaran 2.7 “Wakil, kuasa, dan pihak lain sebagai pemotong/pemungut”", "bagian “Pihak Lain sebagai pemotong/pemungut (Pasal 32A)”"]}, {"b": 1, "q": "Dr. Müller, peneliti asing di bidang bioteknologi dengan pengalaman kerja 8 tahun, menjadi subjek pajak dalam negeri Indonesia. Ia juga menerima dividen dari Jerman dan meminta perlakuan P3B Indonesia–Jerman atas penghasilan tersebut. Ia sekaligus meminta fasilitas \"hanya dipajaki atas penghasilan dari Indonesia selama 4 tahun\". Penilaian yang tepat adalah …", "o": ["Berlaku, karena ia memenuhi syarat keahlian dan pengalaman kerja minimal 5 tahun", "Berlaku, dan P3B Indonesia–Jerman tetap dapat dimanfaatkan sekaligus untuk dividennya", "Tidak berlaku, karena fasilitas 4 tahun dikecualikan bagi WNA yang memakai P3B", "Tidak berlaku, karena bidang penelitian tidak termasuk keahlian tertentu yang diatur"], "a": 2, "e": "WNA SPDN dengan keahlian tertentu di bidang sains, teknologi, dan/atau matematika (sertifikat, ijazah, atau pengalaman minimal 5 tahun) hanya dipajaki atas penghasilan dari Indonesia selama 4 tahun pajak. Ketentuan ini tidak berlaku bagi yang memanfaatkan P3B. Permohonan diputus paling lama 10 HK.", "s": "Slide 636–639", "kw": "keahlian tertentu", "rk": 1, "hit": "Bab 1 · 3.1 Konsep PPh, subjek pajak, BUT, dan yang bukan subjek", "nav": ["Beranda", "Bab 1", "Modul 3 · PPh (tambahan di luar slide)", "Pelajaran 3.1 “Konsep PPh, subjek pajak, BUT, dan yang bukan subjek”", "bagian “Subjek pajak (Pasal 2)”, subbagian “Perubahan dari UU HPP / Cipta Kerja”"]}, {"b": 1, "q": "Sebuah unit yang dibentuk berdasarkan undang-undang dan dibiayai APBN mengelola layanan berbayar. Penerimaannya tidak dimasukkan ke anggaran negara, tetapi dikelola sendiri, meskipun pembukuannya diperiksa aparat pengawasan fungsional negara. Status subjek pajaknya adalah …", "o": ["Bukan subjek pajak, karena dibentuk berdasarkan undang-undang dan dibiayai APBN", "Bukan subjek pajak, karena pembukuannya diperiksa aparat pengawasan fungsional", "Subjek pajak badan, karena tidak memenuhi semua kriteria unit pemerintah", "Subjek pajak orang pribadi, yang kewajibannya dijalankan melalui pimpinan unit"], "a": 2, "e": "Unit pemerintah dikecualikan dari subjek badan hanya kalau memenuhi semua kriteria: dibentuk berdasarkan undang-undang, dibiayai APBN/APBD, penerimaannya dimasukkan dalam anggaran, dan pembukuannya diperiksa aparat pengawasan fungsional negara. Satu kriteria gagal berarti tetap subjek badan.", "s": "Materi tambahan di luar slide · Pasal 2 UU PPh", "kw": "unit pemerintah", "rk": 1, "hit": "Bab 1 · 3.1 Konsep PPh, subjek pajak, BUT, dan yang bukan subjek", "nav": ["Beranda", "Bab 1", "Modul 3 · PPh (tambahan di luar slide)", "Pelajaran 3.1 “Konsep PPh, subjek pajak, BUT, dan yang bukan subjek”", "bagian “Subjek pajak (Pasal 2)”"]}, {"b": 1, "q": "Menjelang Lebaran, PT Sentosa memberi parsel hari raya kepada seluruh pegawai. Sepanjang tahun, perusahaan juga membayar keanggotaan klub golf untuk para manajernya senilai Rp1 juta per orang. Menurut PMK-66/2023, perlakuan PPh bagi penerima adalah …", "o": ["Keduanya dikecualikan dari objek, karena nilai golfnya masih di bawah batas Rp1,5 juta", "Parsel dikecualikan dari objek, sedangkan keanggotaan golf merupakan objek PPh", "Keduanya merupakan objek PPh, karena seluruh natura menjadi objek sejak UU HPP berlaku", "Parsel merupakan objek PPh, sedangkan keanggotaan golf dikecualikan sampai Rp1,5 juta"], "a": 1, "e": "PMK-66/2023: bingkisan hari raya keagamaan untuk seluruh pegawai dikecualikan tanpa batas nilai. Fasilitas olahraga dikecualikan sampai Rp1,5 juta per pegawai per tahun, tetapi golf, pacuan kuda, balap perahu motor, terbang layang, dan otomotif tidak termasuk pengecualian, berapa pun nilainya.", "s": "Materi tambahan di luar slide · PMK-66/2023", "kw": "fasilitas olahraga", "rk": 1, "hit": "Bab 1 · 3.2 Objek PPh: penghasilan, final, yang dikecualikan, dan natura", "nav": ["Beranda", "Bab 1", "Modul 3 · PPh (tambahan di luar slide)", "Pelajaran 3.2 “Objek PPh: penghasilan, final, yang dikecualikan, dan natura”", "bagian “Natura dan kenikmatan”"]}, {"b": 1, "q": "Dalam laporan laba rugi PT Merak terdapat: (1) biaya jamuan klien yang dilengkapi daftar nominatif sesuai ketentuan; (2) sumbangan ke yayasan sosial yang bukan sumbangan tertentu menurut PP; (3) uang pelicin kepada pejabat negara asing untuk memenangkan tender. Koreksi fiskal positif yang tepat adalah atas …", "o": ["Butir (1), (2), dan (3)", "Butir (2) dan (3)", "Butir (1) dan (3)", "Butir (3) saja"], "a": 1, "e": "Biaya jamuan boleh dibiayakan kalau dibuatkan daftar nominatif. Sumbangan pada umumnya tidak boleh dikurangkan, kecuali zakat/sumbangan keagamaan wajib lewat lembaga resmi dan sumbangan tertentu yang diatur PP. Pasal 20A PP 20/2026 menegaskan suap dan gratifikasi, termasuk kepada pejabat publik as mpai SPT Tahunan pertamanya", "Keliru, karena PPh 25-nya adalah jumlah PPh 25 seluruh WP sebelum peleburan", "Keliru, karena PPh 25-nya harus dihitung dari RKAP tahun berjalan yang sudah disahkan", "Benar, kecuali salah satu WP lama adalah wajib pajak masuk bursa atau BUMN"], "a": 1, "e": "PPh 25 WP baru pada umumnya nihil. Tetapi untuk WP baru hasil merger, peleburan, atau pengambilalihan, PPh 25-nya sebesar jumlah PPh 25 semua WP sebelum merger. Untuk pemekaran dibagi menurut persentase harta, dan untuk perubahan bentuk badan sama dengan PPh 25 bulan terakhir.", "s": "Slide 426–438 (PMK-215/2018, kini PMK-81/2024)", "kw": "PPh 25 merger", "rk": 1, "hit": "Bab 1 · 3.6 Pemotongan/pemungutan PPh dan angsuran PPh Pasal 25", "nav": ["Beranda", "Bab 1", "Modul 3 · PPh (tambahan di luar slide)", "Pelajaran 3.6 “Pemotongan/pemungutan PPh dan angsuran PPh Pasal 25”", "bagian “Angsuran PPh 25”"]}, {"b": 1, "q": "Ibu Ratna, orang pribadi bukan PKP yang berdomisili di Bandung, memakai jasa konsultan desain dari Singapura untuk rumah pribadinya. Konsultan itu tidak punya BUT dan tidak ditunjuk sebagai pemungut PMSE. Mana pernyataan yang tepat tentang PPN-nya?", "o": ["Tidak terutang PPN, karena Ibu Ratna bukan PKP dan jasanya hanya untuk keperluan pribadi", "Terutang PPN, tetapi wajib dipungut dan disetor sendiri oleh konsultan dari Singapura", "Terutang di tempat tinggal Ibu Ratna, disetor sendiri, SSP-nya setara Faktur Pajak", "Terutang PPN di tempat kedudukan konsultan, karena pemberi jasanya berada di luar negeri"], "a": 2, "e": "Pemanfaatan JKP dari luar negeri adalah objek PPN, siapa pun pemanfaatnya, PKP maupun bukan. Tempat terutangnya di tempat tinggal/kedudukan pemanfaat. Kalau tidak ada Pihak Lain yang ditunjuk, pemanfaat menyetor sendiri, dan SSP-nya berkedudukan sebagai dokumen yang dipersamakan dengan Faktur Pajak.", "s": "Slide 134–145, 146–155", "kw": "tempat terutang", "rk": 1, "hit": "Bab 1 · 4.4 Kapan dan di mana PPN terutang", "nav": ["Beranda", "Bab 1", "Modul 4 · PPN", "Pelajaran 4.4 “Kapan dan di mana PPN terutang”", "bagian “Tempat terutang”"]}, {"b": 1, "q": "PT Kain Prima (PKP) setiap hari menyerahkan bahan baku kepada perusahaan di kawasan berikat dengan fasilitas PPN tidak dipungut, dan juga menjual secara biasa kepada CV Busana. Untuk menyederhanakan administrasi, ia ingin membuat satu faktur gabungan per bulan untuk masing-masing pembeli. Penilaian yang tepat adalah …", "o": ["Boleh untuk keduanya, asalkan dibuat paling lambat akhir bulan penyerahan masing-masing", "Tidak boleh untuk keduanya, karena faktur gabungan hanya untuk PKP pedagang eceran", "Boleh untuk CV Busana, tetapi tidak untuk penyerahan tidak dipungut terkait kawasan", "Boleh untuk keduanya dalam satu faktur yang menggabungkan semua kode transaksinya"], "a": 2, "e": "Faktur gabungan dibuat untuk seluruh penyerahan kepada pembeli yang sama dalam 1 bulan kalender, paling lambat akhir bulan penyerahan, dan per kode transaksi. Faktur gabungan tidak boleh untuk penyerahan yang mendapat fasilitas PPN tidak dipungut terkait kawasan atau tempat tertentu.", "s": "Slide 146–155", "kw": "faktur gabungan", "rk": 1, "hit": "Bab 1 · 4.5 Faktur Pajak, nota retur, dan nota pembatalan", "nav": ["Beranda", "Bab 1", "Modul 4 · PPN", "Pelajaran 4.5 “Faktur Pajak, nota retur, dan nota pembatalan”", "bagian “Faktur Pajak gabungan”"]}, {"b": 1, "q": "Selama pemeriksaan PPN, PT Nirmala lupa menunjukkan sejumlah Faktur Pajak masukan yang belum dilaporkan di SPT Masa PPN. Faktur itu baru diserahkan setelah SPHP disampaikan, saat PT Nirmala menyusun tanggapan SPHP. Faktur-faktur itu sah secara formal dan material. Bagaimana perlakuannya dalam ketetapan?", "o": ["Tidak dapat dikreditkan dalam ketetapan, karena SPHP sudah disampaikan", "Dapat dikreditkan dalam ketetapan, karena faktur sah secara formal dan material", "Dapat dikreditkan dalam ketetapan, asalkan tanggapan SPHP disampaikan tepat waktu", "Tidak dapat, karena PM yang belum dilaporkan di SPT tidak pernah dapat dikreditkan"], "a": 0, "e": "PM yang belum dilaporkan di SPT Masa PPN, baik diberitahukan PKP maupun ditemukan pemeriksa, dapat dikreditkan dalam ketetapan, dengan syarat memenuhi ketentuan pengkreditan dan dilakukan selama pemeriksaan sepanjang SPHP belum disampaikan.", "s": "Slide 559–566", "kw": "ditemukan saat pemeriksaan", "rk": 2, "hit": "Bab 1 · 4.6 Pengkreditan Pajak Masukan", "nav": ["Beranda", "Bab 1", "Modul 4 · PPN", "Pelajaran 4.6 “Pengkreditan Pajak Masukan”", "bagian “Empat situasi khusus”, subbagian “PM yang ditemukan saat pemeriksaan”"]}, {"b": 1, "q": "PT Hijau memanfaatkan jasa dari luar negeri tetapi tidak menyetor PPN-nya, lalu ditagih dengan SKPKB yang hanya berisi PPN pemanfaatan JKP tersebut. PT Hijau melunasi SKPKB itu, tetapi tetap mengajukan keberatan atas sanksinya. Bolehkah PPN dalam SKPKB itu dikreditkan sebagai Pajak Masukan?", "o": ["Ya, karena ketetapannya hanya berisi PM, disetujui pokoknya, dan sudah dilunasi", "Tidak, karena salah satu syaratnya adalah tidak ada upaya hukum atas ketetapan itu", "Ya, sebesar pokok ditambah sanksi administrasi yang sudah dibayar lunas WP", "Tidak, karena PPN pemanfaatan JKP luar negeri tidak pernah dapat dikreditkan"], "a": 1, "e": "PPN dalam ketetapan dapat dikreditkan sebesar pokoknya kalau: ketetapan hanya untuk menagih PM, PKP menyetujui seluruh hasil pemeriksaan, sudah dilunasi, tidak diajukan upaya hukum (keberatan, Pasal 36, banding, PK, gugatan), dan memenuhi ketentuan pengkreditan. Keberatan atas sanksi pun menggugurkan syarat itu.", "s": "Slide 559–566", "kw": "ditagih dengan ketetapan", "rk": 1, "hit": "Bab 1 · 4.6 Pengkreditan Pajak Masukan", "nav": ["Beranda", "Bab 1", "Modul 4 · PPN", "Pelajaran 4.6 “Pengkreditan Pajak Masukan”", "bagian “Empat situasi khusus”, subbagian “PM yang ditagih dengan ketetapan pajak”"]}, {"b": 1, "q": "Tuan Ferdi membangun rumah tinggal tanpa kontraktor. Tahap pertama seluas 150 m² selesai pada 2025. Satu tahun kemudian, ia menambah lantai dua seluas 100 m². Bagaimana perlakuan PPN Kegiatan Membangun Sendiri?", "o": ["Terutang, karena tahap dengan jeda tidak lebih dari 2 tahun dianggap satu kesatuan", "Tidak terutang, karena luas setiap tahap pembangunannya masih kurang dari 200 m²", "Hanya tahap kedua yang terutang, karena dibangun setelah tahap pertama selesai dihuni", "Tidak terutang, karena rumah tinggal pribadi selalu dikecualikan dari PPN KMS"], "a": 0, "e": "KMS berlaku untuk bangunan dengan luas keseluruhan minimal 200 m², untuk tempat tinggal atau usaha, yang dibangun bukan dalam kegiatan usaha. Pembangunan bertahap dianggap satu kesatuan kalau jeda antartahap tidak lebih dari 2 tahun. Totalnya 250 m², sehingga terutang PPN KMS.", "s": "Slide 530–538", "kw": "membangun sendiri", "rk": 1, "hit": "Bab 1 · 4.2 Objek PPN: apa yang dikenai dan yang tidak", "nav": ["Beranda", "Bab 1", "Modul 4 · PPN", "Pelajaran 4.2 “Objek PPN: apa yang dikenai dan yang tidak”", "bagian “Dua objek khusus”, subbagian “Kegiatan Membangun Sendiri / KMS (Pasal 16C)”"]}, {"b": 1, "q": "Izin usaha perkebunan PT Sawit Lestari berakhir dan tidak diperpanjang, sehingga PT Sawit Lestari mengajukan pencabutan SKT objek PBB. Setelah SKT dicabut, DJP menemukan bahwa PBB untuk dua tahun sebelum pencabutan belum dipenuhi dengan benar. Mana pernyataan yang tepat?", "o": ["Tidak dapat menagih, karena SKT yang dicabut menghapus seluruh kewajiban PBB", "Hanya dapat menagih kalau SKT objek tersebut diaktifkan kembali lebih dulu", "Dapat menagih tanpa batas waktu, karena PBB menganut sistem official assessment", "Tetap dapat menerbitkan SPPT/SKP PBB, dengan jangka waktu 5 tahun"], "a": 3, "e": "DJP dapat menerbitkan SPPT/SKP PBB untuk tahun sebelum SKT terbit, atau sebelum/sesudah pencabutan, kalau ada data kewajiban yang belum dipenuhi, dengan jangka waktu 5 tahun. Pencabutan SKT atas permohonan dilakukan lewat pemeriksaan atau penelitian, diputus paling lama 6 bulan.", "s": "Slide 201–210", "kw": "pencabutan SKT", "rk": 1, "hit": "Bab 1 · 5.3 Pendaftaran objek, SPOP, SPPT, dan pendataan", "nav": ["Beranda", "Bab 1", "Modul 5 · PBB P5L", "Pelajaran 5.3 “Pendaftaran objek, SPOP, SPPT, dan pendataan”", "bagian “1. Pendaftaran objek pajak”"]}, {"b": 1, "q": "Pak Udin, petani berpenghasilan di bawah PTKP, menjual sebidang sawah senilai Rp150 juta. Atas saran seseorang, penjualan itu dipecah menjadi tiga akta masing-masing Rp50 juta kepada pembeli yang sama agar \"bebas PPh\". Penilaian yang tepat adalah …", "o": ["Dapat dibebaskan dengan SKB, karena nilai setiap akta jual belinya di bawah Rp60 juta", "Dapat dibebaskan dengan SKB, karena Pak Udin berpenghasilan di bawah PTKP setahun", "Tidak dapat, karena pengecualian itu tidak berlaku untuk transaksi yang dipecah-pecah", "Tidak dapat dibebaskan, karena pengalihan tanah sawah selalu dikenai tarif final 1%"], "a": 2, "e": "Pengecualian dengan SKB berlaku bagi OP berpenghasilan di bawah PTKP yang mengalihkan tanah/bangunan dengan nilai kurang dari Rp60 juta, dan bukan transaksi yang dipecah-pecah. Tarif umumnya 2,5%. Tarif 1% untuk rumah sederhana oleh pengembang.", "s": "Slide 397–414", "kw": "Surat Keterangan Bebas", "rk": 1, "hit": "Bab 1 · 6.1 PPh final atas tanah/bangunan, DIRE, saham, dan PPh 26 tertentu", "nav": ["Beranda", "Bab 1", "Modul 6 · PMK-81/2024: Ketentuan Khusus", "Pelajaran 6.1 “PPh final atas tanah/bangunan, DIRE, saham, dan PPh 26 tertentu”", "bagian “PPh final pengalihan tanah/bangunan dan PPJB (eks PMK-261/2016)”"]}, {"b": 1, "q": "PT Rekan (PKP) mendapat pesanan barang senilai Rp36 juta termasuk PPN dari sebuah BUMN pemungut. Atas permintaan BUMN, tagihannya dipecah menjadi empat invoice masing-masing Rp9 juta pada bulan yang sama. Siapa yang memungut dan menyetor PPN-nya?", "o": ["PT Rekan sendiri, karena setiap pembayaran nilainya tidak lebih dari Rp10 juta", "PT Rekan sendiri, karena pembayarannya memakai mekanisme uang persediaan BUMN", "BUMN pemungut, karena tiap pembayaran itu pecahan dari transaksi di atas Rp10 juta", "Tidak ada yang memungut, karena transaksi di bawah Rp10 juta bukan objek PPN"], "a": 2, "e": "Pengecualian pemungutan (rekanan memungut sendiri, faktur kode 01) berlaku untuk pembayaran paling banyak Rp10 juta termasuk PPN yang bukan pecahan dari transaksi bernilai lebih dari Rp10 juta. Karena dipecah, BUMN tetap memungut, dan rekanan membuat faktur kode 03.", "s": "Slide 494–548", "kw": "Rp10 juta", "rk": 1, "hit": "Bab 1 · 6.4 Pemungut PPN: BUMN, KKKS, IUPK, asuransi, dan PMSE", "nav": ["Beranda", "Bab 1", "Modul 6 · PMK-81/2024: Ketentuan Khusus", "Pelajaran 6.4 “Pemungut PPN: BUMN, KKKS, IUPK, asuransi, dan PMSE”", "bagian “Pola bersama: BUMN, KKKS, IUPK”"]}, {"b": 1, "q": "PT Rajut menerima investment allowance padat karya. Pada tahun ketiga pemanfaatan, rata-rata tenaga kerja Indonesianya turun menjadi 280 orang, lalu pada tahun keempat kembali menjadi 320 orang. PT Rajut meminta agar masa fasilitasnya diperpanjang satu tahun sebagai ganti tahun ketiga. Penilaian yang tepat adalah …", "o": ["Tahun ketiga hilang, tahun keempat dipakai lagi, tanpa penambahan jangka waktu", "Fasilitas dicabut seluruhnya sejak tahun ketiga dan tidak dapat diberikan kembali", "Fasilitas tahun ketiga hilang, dan jangka waktunya diperpanjang satu tahun sebagai ganti", "Fasilitas tahun ketiga tetap dapat dipakai, karena penurunannya kurang dari 10%"], "a": 0, "e": "Kalau dalam masa pemanfaatan jumlah TKI turun di bawah 300, fasilitas tahun itu tidak dapat dipakai, tetapi dapat dipakai lagi tahun berikutnya kalau jumlahnya pulih. Tidak ada penambahan jangka waktu. Pencabutan berlaku kalau kegiatan usaha utama tidak lagi sesuai atau WP melanggar larangan.", "s": "Slide 608–635 (contoh slide 619)", "kw": "padat karya", "rk": 1, "hit": "Bab 1 · 6.6 Investment allowance padat karya dan super deduction litbang", "nav": ["Beranda", "Bab 1", "Modul 6 · PMK-81/2024: Ketentuan Khusus", "Pelajaran 6.6 “Investment allowance padat karya dan super deduction litbang”", "bagian “Investment allowance padat karya (eks PMK-16/2020)”"]}, {"b": 2, "q": "SP2DK untuk CV Karya dikirim lewat pos, dengan bukti pengiriman tertanggal 3 Maret. Karena perjalanan pos, surat baru sampai di kantor CV Karya pada 9 Maret. Pada 20 Maret, CV Karya mengirim pemberitahuan perpanjangan tertulis yang diterima KPP hari itu juga, karena menghitung 14 hari sejak 9 Maret. Bagaimana kedudukan perpanjangan itu?", "o": ["Berlaku, karena 14 hari dihitung sejak surat benar-benar diterima di kantor WP pada 9 Maret", "Berlaku, karena perpanjangan 7 hari tidak memerlukan izin dan dapat disampaikan kapan saja", "Tidak berlaku, karena 14 hari dihitung sejak bukti pengiriman 3 Maret dan sudah habis", "Tidak berlaku, karena perpanjangan tanggapan SP2DK hanya dapat diajukan langsung ke KPP"], "a": 2, "e": "Untuk SP2DK yang dikirim lewat pos atau kurir, tanggal diterima adalah tanggal bukti pengiriman, bukan tanggal surat sampai. Perpanjangan 7 hari memang tanpa izin, tetapi pemberitahuan tertulisnya harus diterima KPP sebelum jangka 14 hari berakhir. Pemberitahuan boleh dikirim lewat Akun WP, pos/kurir, atau langsung.", "s": "Slide 653–654", "kw": "pemberitahuan perpanjangan", "rk": 1, "hit": "Bab 2 · 2.2 Jangka waktu dan cara WP menanggapi", "nav": ["Beranda", "Bab 2", "Modul 2 · P2DK (SP2DK)", "Pelajaran 2.2 “Jangka waktu dan cara WP menanggapi”", "bagian “14 hari, bisa +7 hari”, lihat juga bagian “Mulai dihitung kapan?”"]}, {"b": 2, "q": "KPP menerbitkan SP2DK untuk PT Orion di Akun WP pada 2 Mei. Untuk berjaga-jaga, AR juga mengirim salinannya lewat kurir dengan bukti pengiriman 4 Mei, dan surat itu diterima resepsionis PT Orion pada 6 Mei. Direktur PT Orion baru membuka Akun WP pada 10 Mei. Jangka waktu tanggapan dihitung sejak …", "o": ["4 Mei, karena pengiriman fisik dengan bukti kirim mengesampingkan Akun WP", "2 Mei, karena dipakai peristiwa yang lebih dahulu, yaitu penerbitan di Akun WP", "6 Mei, karena saat itulah surat diterima secara nyata oleh pegawai WP", "10 Mei, karena Akun WP baru dianggap diterima saat dibuka oleh pengurus"], "a": 1, "e": "SP2DK dianggap diterima pada peristiwa yang lebih dahulu: penerbitan (Akun WP), pengiriman (pos elektronik), bukti pengiriman (faksimile, pos/kurir), atau penyampaian (langsung). Untuk Akun WP, waktunya berjalan sejak terbit walaupun akun baru dibuka belakangan.", "s": "Slide 653–654", "kw": "peristiwa yang lebih dahulu", "rk": 2, "hit": "Bab 2 · 2.2 Jangka waktu dan cara WP menanggapi", "nav": ["Beranda", "Bab 2", "Modul 2 · P2DK (SP2DK)", "Pelajaran 2.2 “Jangka waktu dan cara WP menanggapi”", "bagian “Mulai dihitung kapan? \"Diterima\" itu tanggal berapa?”"]}, {"b": 2, "q": "Pembahasan SP2DK PT Lintang dilakukan lewat video conference, tetapi BAP2DK tidak dapat ditandatangani secara elektronik. AR mengirim konsep BAP2DK. Enam hari kerja kemudian, konsep itu belum juga dikembalikan. Kuasa PT Lintang berpendapat bahwa karena belum ada tanda tangan, pembahasan dianggap tidak pernah terjadi. Penilaian yang tepat adalah …", "o": ["Benar; pembahasan harus diulang secara luring karena konsep tidak kembali dalam 5 hari kerja", "Keliru; WP dianggap menyetujui seluruh isi BAP2DK dan otomatis memenuhi kewajibannya", "Benar; P2DK harus ditutup dengan SP3-P2DK karena BAP2DK tidak selesai dalam jangka waktunya", "Keliru; WP dianggap hadir tetapi menolak menandatangani, sehingga BAP2DK cukup oleh AR"], "a": 3, "e": "Kalau pembahasan daring tidak bisa ditutup dengan TTE, AR mengirim konsep BAP2DK dan WP harus mengirimnya kembali dalam 5 hari kerja. Kalau tidak dikirim kembali, WP dianggap menghadiri pembahasan tetapi tidak bersedia menandatangani, sehingga BAP2DK cukup ditandatangani AR. Ini satu-satunya jangka hari kerja di P2DK.", "s": "Slide 655–658", "kw": "konsep BAP2DK", "rk": 1, "hit": "Bab 2 · 2.3 Pembahasan, kunjungan, dan Berita Acara P2DK", "nav": ["Beranda", "Bab 2", "Modul 2 · P2DK (SP2DK)", "Pelajaran 2.3 “Pembahasan, kunjungan, dan Berita Acara P2DK”", "bagian “Penandatanganan kalau pembahasannya daring”"]}, {"b": 2, "q": "PT Bahari menanggapi SP2DK tepat waktu, dan AR menilai sebagian penjelasannya sudah sesuai. Setelah itu, AR menerima data tambahan dari pihak ketiga tentang penjualan aset tanah PT Bahari yang nilainya diragukan. AR ingin mengundang pembahasan dengan melibatkan seorang Penilai, dan kalau perlu membahas lagi di pertemuan berikutnya. Mana yang sesuai PMK-111/2025?", "o": ["Semuanya dapat: ada data tambahan, pegawai lain boleh dilibatkan, dan boleh lebih dari sekali", "Pembahasan tidak dapat dilakukan, karena WP sudah menanggapi SP2DK dalam jangka waktunya", "Pembahasan dapat dilakukan, tetapi hanya oleh AR dan harus selesai dalam satu kali pertemuan", "Pembahasan dapat dilakukan, tetapi data tambahan harus dituangkan lebih dulu dalam SP2DK baru"], "a": 0, "e": "Pembahasan atau kunjungan dapat dilakukan kalau tanggapan WP tidak sesuai, ada data atau keterangan tambahan, atau WP tidak menanggapi. Pembahasan dilakukan dengan surat undangan, daring atau luring, membahas SP2DK, tanggapan, dan data tambahan. Pembahasan dapat melibatkan pegawai DJP lain (misalnya Penilai) dan dapat dilakukan lebih dari sekali.", "s": "Slide 655–658", "kw": "pembahasan", "rk": 1, "hit": "Bab 2 · 2.3 Pembahasan, kunjungan, dan Berita Acara P2DK", "nav": ["Beranda", "Bab 2", "Modul 2 · P2DK (SP2DK)", "Pelajaran 2.3 “Pembahasan, kunjungan, dan Berita Acara P2DK”", "bagian “Aturan pembahasan (Pasal 7)”"]}, {"b": 2, "q": "P2DK atas sebuah perusahaan tambang menemukan dua hal: (1) jaringan conveyor di area tambangnya, yang merupakan objek PBB P5L, belum pernah didaftarkan; dan (2) perusahaan itu tetap memanfaatkan status PKP berisiko rendah, padahal syaratnya sudah tidak terpenuhi. Usulan hasil P2DK yang tepat untuk masing-masing adalah …", "o": ["(1) huruf g, perubahan data objek PBB secara jabatan; (2) huruf e, pencabutan PKP secara jabatan", "(1) huruf f, pendaftaran objek PBB secara jabatan; (2) huruf m, pembatasan layanan publik tertentu", "(1) huruf g, perubahan data objek PBB secara jabatan; (2) huruf j, perubahan administrasi layanan/fasilitas", "(1) huruf f, pendaftaran objek PBB secara jabatan; (2) huruf j, perubahan administrasi layanan/fasilitas"], "a": 3, "e": "Objek PBB P5L yang belum didaftarkan diusulkan dengan huruf f. Huruf g dipakai kalau objeknya sudah terdaftar tetapi datanya tidak sesuai. Status PKP berisiko rendah adalah layanan/fasilitas, sehingga yang diusulkan huruf j. Huruf e mencabut status PKP-nya sendiri, dan huruf m membatasi layanan publik yang mensyaratkan status patuh.", "s": "Slide 659", "kw": "usulan lain", "rk": 1, "hit": "Bab 2 · 2.4 Hasil P2DK: case closed atau usulan lain", "nav": ["Beranda", "Bab 2", "Modul 2 · P2DK (SP2DK)", "Pelajaran 2.4 “Hasil P2DK: case closed atau usulan lain”", "bagian “Huruf b–q: usulan lain”"]}, {"b": 2, "q": "Setelah SPT Tahunannya dibetulkan, PPh Pasal 25 CV Damar seharusnya naik, tetapi CV Damar tetap membayar dengan angka lama. KPP mengirim imbauan; CV Damar tidak menanggapi, hadir saat pembahasan, tetapi tetap tidak mau menyesuaikan angsurannya. AR ingin langsung mengusulkan pemeriksaan sebagai hasil kegiatan imbauan. Penilaian yang tepat adalah …", "o": ["Pemeriksaan dapat diusulkan, karena WP tetap tidak memenuhi kewajiban setelah pembahasan", "Tidak dapat; hasil imbauan tidak mencakup pemeriksaan, tetapi ada penetapan nilai angsuran", "Pemeriksaan dapat diusulkan, tetapi harus didahului penerbitan surat teguran lebih dulu", "Hasil imbauan hanya dapat berupa penutupan kegiatan, sehingga AR harus menerbitkan SP2DK"], "a": 1, "e": "Hasil imbauan berhuruf a–l. Yang khas imbauan adalah huruf b, penetapan nilai angsuran pajak tahun berjalan. Dibanding hasil P2DK (a–q), hasil imbauan tidak mencakup pencabutan PKP, pembetulan produk hukum, penilaian, intelijen, pemeriksaan, dan bukper.", "s": "Slide 660–668", "kw": "penetapan nilai angsuran", "rk": 1, "hit": "Bab 2 · 3.1 Penyampaian imbauan", "nav": ["Beranda", "Bab 2", "Modul 3 · Imbauan dan teguran", "Pelajaran 3.1 “Penyampaian imbauan”", "bagian “Hasil kegiatan imbauan: huruf a–l”"]}, {"b": 2, "q": "Penelitian Kepatuhan Formal menemukan tiga WP: (1) PT X tidak menyampaikan SPT Tahunan sampai batas waktu; (2) CV Y belum menyesuaikan PPh 25 setelah membetulkan SPT; (3) PT Z menyampaikan laporan yang salah tulis dan dokumen pendukungnya belum lengkap. Tindak lanjut yang paling tepat adalah …", "o": ["(1) SP2DK; (2) STP bunga angsuran; (3) teguran karena laporan tidak lengkap", "(1) teguran dan STP denda; (2) SP2DK atas angsuran; (3) pemeriksaan tujuan lain", "(1) imbauan lapor SPT; (2) teguran karena angsuran kurang; (3) SP2DK atas salah tulis", "(1) teguran dan STP denda; (2) imbauan angsuran; (3) imbauan pembetulan laporan"], "a": 3, "e": "Hasil PnKF dikumpulkan dalam daftar nominatif dan ditindaklanjuti dengan imbauan, pemeriksaan tujuan lain, teguran, STP, atau perubahan layanan. SPT yang tidak disampaikan ditindaklanjuti dengan teguran, dan dendanya ditagih dengan STP. SE-8/PJ/2026 menyebut imbauan angsuran (termasuk karena pembetulan SPT) dan imbauan pembetulan laporan (salah tulis atau dokumen pendukung belum lengkap). SP2DK tidak perlu karena faktanya sudah jelas.", "s": "Slide 645; SE-8/PJ/2026", "kw": "daftar nominatif", "rk": 1, "hit": "Bab 2 · 1.2 Penelitian Kepatuhan Formal dan daftar nominatif", "nav": ["Beranda", "Bab 2", "Modul 1 · Merencanakan dan meneliti", "Pelajaran 1.2 “Penelitian Kepatuhan Formal dan daftar nominatif”", "bagian “Hasilnya: daftar nominatif”"]}, {"b": 2, "q": "PT Kenari, WP Strategis kategori 2 di sebuah KPP Pratama, mengalami penurunan usaha 60% pada 2024 dan 55% pada 2025. Penelitian komprehensif baru dilakukan untuk Tahun Pajak 2025. KPP mengusulkan agar PT Kenari diturunkan menjadi WP Lainnya atas dasar penurunan usaha. Penilaian yang tepat adalah …", "o": ["Memenuhi, karena usahanya sudah turun minimal 50% selama dua tahun berturut-turut", "Belum memenuhi, karena penurunan usaha harus minimal 50% selama tiga tahun berturut-turut", "Memenuhi, asalkan usulan evaluasi disampaikan dalam 5 hari kerja sejak keputusan Dirjen", "Belum memenuhi, karena penelitian komprehensif harus untuk dua tahun pajak terakhir"], "a": 3, "e": "Menurut SE-8/PJ/2026, WP Strategis dapat diturunkan menjadi WP Lainnya, misalnya kalau usahanya turun minimal 50% dua tahun berturut-turut dan sudah diteliti komprehensif untuk dua tahun pajak terakhir. Penurunan saja tidak cukup. Jalan lain: tidak lagi memenuhi syarat subjektif/objektif, atau kebijakan Kepala Kanwil.", "s": "SE-8/PJ/2026", "kw": "WP Strategis", "rk": 2, "hit": "Bab 2 · 1.1 Dua jalur pengawasan: PPM dan PKM", "nav": ["Beranda", "Bab 2", "Modul 1 · Merencanakan dan meneliti", "Pelajaran 1.1 “Dua jalur pengawasan: PPM dan PKM”", "bagian “Komite Kepatuhan dan Wajib Pajak Strategis”"]}, {"b": 2, "q": "Pada September 2026, AR meneliti tiga kewajiban PT Saka: (1) SPT Tahunan PPh Badan 2025; (2) SPT Masa PPN November 2025; (3) SPT Masa PPN Desember 2025. Berdasarkan jatuh temponya, pembagian jalur pengawasan yang tepat adalah …", "o": ["(1) PKM, (2) PKM, (3) PKM", "(1) PPM, (2) PPM, (3) PPM", "(1) PPM, (2) PKM, (3) PPM", "(1) PKM, (2) PKM, (3) PPM"], "a": 2, "e": "Patokannya tahun jatuh tempo, bukan tahun transaksinya. SPT Tahunan 2025 jatuh tempo April 2026, dan SPT Masa PPN Desember 2025 jatuh tempo akhir Januari 2026, sehingga keduanya PPM. SPT Masa PPN November 2025 jatuh tempo akhir Desember 2025, sebelum tahun berjalan, sehingga masuk PKM.", "s": "Slide 645; SE-8/PJ/2026", "kw": "PPM", "rk": 1, "hit": "Bab 2 · 1.1 Dua jalur pengawasan: PPM dan PKM", "nav": ["Beranda", "Bab 2", "Modul 1 · Merencanakan dan meneliti", "Pelajaran 1.1 “Dua jalur pengawasan: PPM dan PKM”", "bagian “Pembagian berdasarkan waktu jatuh tempo”"]}, {"b": 2, "q": "Saat meneliti PT Selaras yang masuk DPP, AR menemukan pembelian dari pemasok yang patut diduga menerbitkan faktur fiktif, dengan estimasi potensi yang signifikan. Ternyata PT Selaras sedang menjalani pemeriksaan bukti permulaan oleh unit lain. Tindak lanjut yang tepat dari AR adalah …", "o": ["Menerbitkan SP2DK agar WP dapat membetulkan sendiri sebelum bukper selesai", "Meneruskan data dan/atau keterangan kepada unit yang sedang menangani bukper", "Mengusulkan pemeriksaan bukti permulaan baru atas temuan faktur fiktif tersebut", "Tidak menindaklanjuti, karena WP yang sedang bukper dikeluarkan dari DPP"], "a": 1, "e": "PnKM punya tiga kemungkinan hasil. Kalau WP sedang atau telah diperiksa, sedang bukper, atau sedang disidik, data diteruskan ke unit yang menangani agar tidak tumpang tindih. Kalau tidak ada indikasi, data tidak ditindaklanjuti. Kalau ada indikasi dan potensi, tindak lanjutnya P2DK, usul pemeriksaan, atau usul bukper.", "s": "Slide 645; SE-8/PJ/2026", "kw": "penerusan data", "rk": 1, "hit": "Bab 2 · 1.3 Penelitian Kepatuhan Material: dari data sampai keputusan", "nav": ["Beranda", "Bab 2", "Modul 1 · Merencanakan dan meneliti", "Pelajaran 1.3 “Penelitian Kepatuhan Material: dari data sampai keputusan”", "bagian “Tiga kemungkinan hasil”"]}, {"b": 2, "q": "PT Arunika menerima surat teguran karena tidak menyampaikan SPT Tahunan, lalu diundang pembahasan. Sebelum pertemuan, AR menemukan data penjualan PT Arunika kepada pihak ketiga yang belum dilaporkan, dan ingin membahasnya sekaligus dalam pembahasan teguran itu. Langkah yang tepat adalah …", "o": ["Hanya surat teguran yang dibahas; data penjualan lewat SP2DK tersendiri", "Data penjualan dapat dibahas sekaligus, karena aturan pembahasan P2DK berlaku mutatis mutandis", "Data penjualan dapat dibahas, asalkan dicantumkan sebagai data tambahan dalam surat undangan", "Pembahasan teguran harus dibatalkan dan diganti dengan pemeriksaan untuk tujuan lain"], "a": 0, "e": "Aturan pembahasan P2DK berlaku mutatis mutandis untuk teguran, tetapi yang dibahas hanya surat teguran itu sendiri. Tidak ada unsur tanggapan dan data tambahan seperti pada SP2DK dan imbauan. Data yang perlu dijelaskan WP adalah wilayah SP2DK.", "s": "Slide 669–672", "kw": "teguran", "rk": 1, "hit": "Bab 2 · 3.2 Pemberian teguran dan perbandingan tiga instrumen", "nav": ["Beranda", "Bab 2", "Modul 3 · Imbauan dan teguran", "Pelajaran 3.2 “Pemberian teguran dan perbandingan tiga instrumen”", "bagian “Tindak lanjut teguran”"]}, {"b": 2, "q": "Pada 2026, KPP akan menerbitkan dua STP untuk PT Bumi: (1) STP Bea Meterai untuk Tahun Pajak 2023; dan (2) STP denda keterlambatan SPT Masa PPh 21 Masa November 2024. Menurut petunjuk masa transisi, aplikasi yang dipakai adalah …", "o": ["(1) Coretax; (2) Approweb dan SIDJP", "(1) Approweb dan SIDJP; (2) Approweb dan SIDJP", "(1) Coretax; (2) Coretax", "(1) Approweb dan SIDJP; (2) Coretax"], "a": 0, "e": "Kewajiban s.d. Tahun Pajak 2024 dan Masa s.d. Desember 2024 diteliti di Approweb dan SIDJP. Pengecualiannya adalah kriteria STP untuk seluruh tahun pajak yang dikerjakan di Coretax: Bea Meterai dan PBB, imbalan bunga yang seharusnya tidak diberikan, dan denda penagihan yang keberatannya diajukan lewat Coretax.", "s": "Slide 673–680", "kw": "kriteria STP", "rk": 1, "hit": "Bab 2 · 4.1 Approweb atau Coretax? Aturan peralihan pengawasan", "nav": ["Beranda", "Bab 2", "Modul 4 · Masa transisi Coretax", "Pelajaran 4.1 “Approweb atau Coretax? Aturan peralihan pengawasan”", "bagian “Penelitian Kepatuhan Formal”"]}, {"b": 2, "q": "Keberatan PT Wira diajukan pada 2024 lewat sistem lama dan ditolak. PT Wira lalu banding. Putusan banding menolak, dan SP2B-nya terbit di Coretax pada 2025. Daftar nominatif STP untuk kasus ini belum tersedia di Coretax. Bagaimana STP denda 60% diterbitkan?", "o": ["Lewat sistem legacy, karena permohonan keberatannya dahulu diajukan di legacy", "Lewat sistem legacy, sambil menunggu daftar nominatifnya tersedia di Coretax", "Lewat Coretax, dengan membangkitkan manual case karena dafnom belum tersedia", "Lewat Coretax, tetapi denda yang ditagih tetap denda 30% atas keberatan"], "a": 2, "e": "Menurut ND-927/PJ.06/2025, kalau keberatan diajukan di legacy tetapi putusan upaya hukum terakhir terbit di Coretax, STP diterbitkan lewat Coretax dengan daftar nominatif yang tersedia, atau lewat manual case kalau dafnom belum ada. Kalau banding diajukan, denda 30% tidak dikenakan; yang berlaku denda 60%.", "s": "Slide 673–680", "kw": "STP denda penagihan", "rk": 1, "hit": "Bab 2 · 4.1 Approweb atau Coretax? Aturan peralihan pengawasan", "nav": ["Beranda", "Bab 2", "Modul 4 · Masa transisi Coretax", "Pelajaran 4.1 “Approweb atau Coretax? Aturan peralihan pengawasan”", "bagian “Penelitian Kepatuhan Formal”, subbagian “STP denda penagihan (ND-927/PJ.06/2025)”"]}, {"b": 2, "q": "Di Coretax masuk dua data RBP: (1) data intelijen Tahun Pajak 2023 atas WP tunggal yang perlu diteliti secara material; (2) data KPD Tahun Pajak 2025 yang setelah dicek tidak menghasilkan potensi. Tindak lanjut yang tepat adalah …", "o": ["(1) tolak, alasan “Ditindaklanjuti di Legacy”, lalu usul DPP di Legacy; (2) tolak, alasan “Potensi Perpajakan”", "(1) setujui di Coretax dan jadikan DPP di Coretax; (2) tolak dengan alasan “Potensi Perpajakan”", "(1) tolak dengan alasan “Potensi Perpajakan”; (2) setujui di Coretax karena tahun pajaknya 2025", "(1) tolak di Coretax lalu lanjutkan WRA di Legacy; (2) tolak dengan alasan “Ditindaklanjuti di Legacy”"], "a": 0, "e": "Data RBP s.d. 2024 yang perlu ditindaklanjuti ditolak di Coretax lalu dikerjakan di legacy. Untuk WP tunggal yang perlu PnKM, data ditolak dengan alasan “Ditindaklanjuti di Legacy” lalu diusulkan menjadi DPP di Legacy. WRA adalah jalur WP nontunggal. Data tahun berapa pun yang tidak menghasilkan potensi ditolak dengan alasan “Potensi Perpajakan”.", "s": "Slide 673–680", "kw": "Potensi Perpajakan", "rk": 1, "hit": "Bab 2 · 4.1 Approweb atau Coretax? Aturan peralihan pengawasan", "nav": ["Beranda", "Bab 2", "Modul 4 · Masa transisi Coretax", "Pelajaran 4.1 “Approweb atau Coretax? Aturan peralihan pengawasan”", "bagian “Perubahan tindak lanjut data RBP (ND-927/PJ.06/2025)”"]}, {"b": 2, "q": "PT Cakra terdaftar di sebuah KPP Madya di Jakarta dan punya tempat usaha di Bandung yang kini tercatat sebagai NITKU. Ada tindak lanjut pengawasan atas kegiatan di tempat usaha Bandung untuk Tahun Pajak 2025. Siapa yang melakukannya?", "o": ["AR di KPP Pratama lokasi Bandung, karena kegiatannya terjadi di wilayah itu", "Petugas di Kanwil yang membawahi KPP Pratama lokasi Bandung", "AR di KPP lokasi Bandung, dengan supervisi Kepala Seksi KPP Madya", "Petugas pengawasan di KPP Pusat, sesuai administrasi WP pusat"], "a": 3, "e": "Di Coretax, cabang adalah NITKU dari NPWP pusat, sehingga administrasinya mengikuti pusat. Tindak lanjut pengawasan WP cabang di KPP lokasi dilakukan oleh petugas pengawasan di KPP Pusat. Untuk masa s.d. 2024, pengawasan cabang dilakukan petugas dengan tugas dan fungsi yang sama dengan petugas WP pusat.", "s": "Slide 673–680", "kw": "WP cabang", "rk": 1, "hit": "Bab 2 · 4.1 Approweb atau Coretax? Aturan peralihan pengawasan", "nav": ["Beranda", "Bab 2", "Modul 4 · Masa transisi Coretax", "Pelajaran 4.1 “Approweb atau Coretax? Aturan peralihan pengawasan”", "bagian “Pola kerja WP cabang”"]}, {"b": 2, "q": "Objek PBB perkebunan milik PT Agro dinilai dalam tiga konteks: (1) penelitian SPOP dalam pengawasan; (2) penyelesaian keberatan PBB; (3) penghitungan kerugian negara dalam pemeriksaan bukti permulaan. Cara penilaian yang tepat untuk masing-masing adalah …", "o": ["(1) penilaian kantor; (2) penilaian kantor; (3) penilaian lapangan", "(1) penilaian lapangan; (2) penilaian lapangan; (3) penilaian lapangan", "(1) penilaian lapangan; (2) penilaian kantor; (3) penilaian kantor", "(1) penilaian kantor; (2) penilaian lapangan; (3) penilaian lapangan"], "a": 3, "e": "Pasal 3 PMK-79/2023 mengatur cara penilaian untuk NJOP. Untuk pengawasan dipakai penilaian kantor. Untuk pemeriksaan PBB, keberatan, pengurangan PBB, bukper, dan penyidikan dipakai penilaian lapangan.", "s": "Slide 681–686", "kw": "penilaian kantor", "rk": 1, "hit": "Bab 2 · 5.1 Penilaian: kenapa perlu, lingkup, dan untuk NJOP", "nav": ["Beranda", "Bab 2", "Modul 5 · Penilaian untuk tujuan perpajakan", "Pelajaran 5.1 “Penilaian: kenapa perlu, lingkup, dan untuk NJOP”", "bagian “Penilaian untuk NJOP PBB (Pasal 3)”"]}, {"b": 2, "q": "Unit penilaian sebuah Kanwil menerima permintaan menilai bisnis tambang batu bara. Tidak satu pun Penilainya berpengalaman menilai bisnis tambang, dan SPPn sudah ditetapkan enam minggu lalu. Mana pernyataan yang paling tepat?", "o": ["Bantuan Penilai hanya dapat diminta oleh Dirjen, dan jangka 3 bulan dihitung ulang sejak bantuan disetujui", "Minta bantuan Penilai ke unit lain dengan latar belakang, tujuan, dan data objek; tetap 3 bulan sejak SPPn", "Penilaian harus dihentikan dan dialihkan ke penilai publik, karena objeknya di luar keahlian tim Kanwil", "Kepala unit dapat meminta bantuan Penilai, dan jangka penilaian otomatis bertambah 3 bulan sejak permintaan"], "a": 1, "e": "Tim Penilai bekerja berdasarkan SPPn (atau SPPn perubahan) yang ditetapkan kepala unit penilaian. Jangka waktunya paling lama 3 bulan sejak SPPn ditetapkan sampai Laporan Penilaian ditandatangani. Kepala unit dapat meminta bantuan penilaian atau Penilai dari unit lain, dilengkapi latar belakang, tujuan, serta data dan informasi objek.", "s": "Slide 687–693", "kw": "bantuan penilaian", "rk": 1, "hit": "Bab 2 · 5.2 Pemicu penilaian harta dan bisnis, tim penilai, dan tahapannya", "nav": ["Beranda", "Bab 2", "Modul 5 · Penilaian untuk tujuan perpajakan", "Pelajaran 5.2 “Pemicu penilaian harta dan bisnis, tim penilai, dan tahapannya”", "bagian “Bantuan penilaian (Pasal 32)”, lihat juga “Surat perintah dan tim penilai (Pasal 6)”"]}, {"b": 2, "q": "Saat meneliti PT Delta, AR menemukan pinjaman sangat besar dari pemegang sahamnya, tanpa jadwal pelunasan dan tanpa bunga yang wajar. AR menduga pinjaman itu sebenarnya modal. Tindak lanjut hasil P2DK yang sesuai, berikut dasar dan cara penilaiannya, adalah …", "o": ["Huruf n (penilaian), pemicu Pasal 10 ayat (1) UU PPh, dengan penilaian lapangan", "Huruf p (pemeriksaan), karena penilaian tidak dapat dipakai dalam rangka pengawasan", "Huruf n (penilaian), pemicu Pasal 18 ayat (3) UU PPh, dengan penilaian kantor", "Huruf o (intelijen), pemicu Pasal 18 ayat (3a) UU PPh, dengan penilaian kantor"], "a": 2, "e": "Pasal 18 ayat (3) UU PPh menjadi pemicu penilaian untuk menentukan kembali penghasilan dan pengurangan serta menentukan utang sebagai modal. Hasil P2DK yang mengarah ke situ adalah huruf n (penilaian). Dalam kegiatan pengawasan dipakai penilaian kantor. Pasal 18 ayat (3a) terkait APA, dan Pasal 10 ayat (1) terkait harga jual beli yang dipengaruhi hubungan istimewa.", "s": "Slide 683, 687–693", "kw": "utang sebagai modal", "rk": 1, "hit": "Bab 2 · 5.2 Pemicu penilaian harta dan bisnis, tim penilai, dan tahapannya", "nav": ["Beranda", "Bab 2", "Modul 5 · Penilaian untuk tujuan perpajakan", "Pelajaran 5.2 “Pemicu penilaian harta dan bisnis, tim penilai, dan tahapannya”", "bagian “Pemicu menurut undang-undang”"]}, {"b": 2, "q": "SPOP PBB perkebunan PT Hevea terbit otomatis di Coretax pada 1 Februari, dan PT Hevea menyampaikannya pada hari ke-25. Dua minggu setelah jangka 30 hari berakhir, bagian pajaknya menemukan luas areal yang dilaporkan kurang dan ingin membetulkannya. Belum ada surat apa pun dari KPP. Penilaian yang tepat adalah …", "o": ["Tidak dapat dibetulkan, karena pembetulan hanya dapat dilakukan setelah ada surat klarifikasi", "Masih dapat dibetulkan, tetapi hanya dalam 7 hari sejak SPOP disampaikan", "Tidak dapat dibetulkan, karena SPOP yang sudah disampaikan tidak dapat diubah lagi", "Masih dapat dibetulkan sukarela, karena batasnya 15 hari setelah berakhirnya jangka 30 hari"], "a": 3, "e": "Pembetulan SPOP sukarela dapat dilakukan paling lama 15 hari setelah jangka 30 hari penyampaian berakhir. Dua minggu masih di dalam batas itu. Kalau KPP sudah menerbitkan surat permintaan klarifikasi, pembetulan dilakukan paling lama 7 hari sejak surat diterima.", "s": "Slide 292–302, 821", "kw": "pembetulan SPOP", "rk": 1, "hit": "Bab 2 · 6.1 Siklus pengawasan PBB P5L: dari SPOP sampai SPPT", "nav": ["Beranda", "Bab 2", "Modul 6 · Pengawasan PBB P5L", "Pelajaran 6.1 “Siklus pengawasan PBB P5L: dari SPOP sampai SPPT”", "bagian “Batas waktu SPOP dalam satu tabel”"]}, {"b": 2, "q": "Petugas datang untuk pendataan lapangan atas objek PBB pertambangan milik PT Batu Hitam. Pengelola lokasi menolak pendataan dan juga menolak menandatangani surat pernyataan penolakan. Langkah yang tepat adalah …", "o": ["Pendataan dihentikan, dan KPP langsung menerbitkan SKP PBB secara jabatan", "Petugas wajib kembali dengan surat tugas baru sampai pengelola bersedia didata", "Penolakan dicatat, lalu objek dianggap tidak ada sampai WP menyampaikan SPOP", "Dibuat berita acara penolakan, dan pendataan tetap berjalan dengan data milik DJP"], "a": 3, "e": "Kalau WP menolak pendataan lapangan, WP menandatangani surat pernyataan penolakan. Kalau WP juga menolak menandatangani, petugas membuat berita acara penolakan, dan pendataan tetap dilakukan berdasarkan data yang dimiliki DJP. Laporan Hasil Pendataan dapat dipakai untuk penelitian material atau analisis risiko usulan pemeriksaan.", "s": "Slide 292–302, 821", "kw": "pendataan lapangan", "rk": 2, "hit": "Bab 2 · 6.1 Siklus pengawasan PBB P5L: dari SPOP sampai SPPT", "nav": ["Beranda", "Bab 2", "Modul 6 · Pengawasan PBB P5L", "Pelajaran 6.1 “Siklus pengawasan PBB P5L: dari SPOP sampai SPPT”", "bagian “Pendataan sebagai alat pengawasan”"]}, {"b": 3, "q": "Tuan Gilang belum terdaftar dan Akun WP-nya belum aktif. SP2DK ekstensifikasi untuknya terbit di sistem pada 1 Juni. Tim juga mengantarkannya langsung dan menyerahkannya kepada istrinya pada 5 Juni. Tuan Gilang baru mengaktivasi Akun WP pada 12 Juni. Jangka 14 hari dihitung sejak …", "o": ["5 Juni, karena penyerahan langsung adalah peristiwa yang lebih dahulu", "1 Juni, karena SP2DK sudah terbit di sistem Coretax pada tanggal itu", "12 Juni, karena untuk akun belum aktif jangka waktunya selalu dihitung sejak aktivasi", "5 Jun
