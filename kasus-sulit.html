i, tetapi hanya kalau istrinya bersedia menandatangani berita acara penyampaian"], "a": 0, "e": "Untuk WP belum terdaftar, 14 hari dihitung sejak peristiwa yang lebih dahulu: penerbitan (akun aktif), tanggal aktivasi akun (akun belum aktif), bukti pengiriman pos/kurir, atau penyampaian langsung kepada WP, wakil, kuasa, pegawai, atau keluarga dewasa. Karena akun belum aktif, titiknya 12 Juni, tetapi penyerahan langsung 5 Juni lebih dahulu.", "s": "Slide 785, 788–794", "kw": "tanggal aktivasi Akun WP", "rk": 1, "hit": "Bab 3 · 2.1 SP2DK untuk WP belum terdaftar: kirim dan tanggapi", "nav": ["Beranda", "Bab 3", "Modul 2 · Pelaksanaan", "Pelajaran 2.1 “SP2DK untuk WP belum terdaftar: kirim dan tanggapi”", "bagian “Jangka waktu tanggapan”"]}, {"b": 3, "q": "Nyonya Wulan menerima SP2DK ekstensifikasi yang menyebut dua data: pembelian ruko dan transfer rutin dari marketplace. Ia tidak setuju dengan data marketplace, karena rekening itu milik usaha adiknya. Ia juga ingin menyampaikan data utang bank yang tidak disebut dalam SP2DK. Mana pernyataan yang tepat?", "o": ["Ketidaksetujuan cukup dinyatakan tertulis, sedangkan data di luar SP2DK hanya disampaikan saat pembahasan akhir", "Tanggapan hanya boleh satu kali, sehingga seluruh ketidaksetujuan dan data tambahan harus dikirim sekaligus", "Wajib disertai bukti; data di luar SP2DK boleh; kirim ke pos elektronik yang tertera di SP2DK", "Data di luar SP2DK tidak boleh disampaikan, karena tanggapan terbatas pada data yang ditanyakan dalam SP2DK"], "a": 2, "e": "Kalau WP tidak menyetujui sebagian atau seluruh data dalam SP2DK, penjelasannya disertai bukti dan/atau dokumen pendukung. WP juga boleh menyampaikan data selain yang disebut dalam SP2DK, dan menanggapi lebih dari sekali dalam jangka waktunya. Salurannya: Akun WP, pos elektronik yang tertera dalam SP2DK, pos/kurir, langsung saat kunjungan, atau langsung/daring ke KPP.", "s": "Slide 785, 788–794", "kw": "pos elektronik yang tertera", "rk": 1, "hit": "Bab 3 · 2.1 SP2DK untuk WP belum terdaftar: kirim dan tanggapi", "nav": ["Beranda", "Bab 3", "Modul 2 · Pelaksanaan", "Pelajaran 2.1 “SP2DK untuk WP belum terdaftar: kirim dan tanggapi”", "bagian “Tanggapan WP”"]}, {"b": 3, "q": "Pada 2026, tim ekstensifikasi menangani Tuan Rendra, pemilik jasa katering yang berpenghasilan di atas PTKP sejak 2018 tetapi tidak pernah mendaftar. Ketua tim ingin menghitung potensi PPh-nya saja, sejak 2018, supaya \"semua tahun tertagih\". Penilaian yang tepat adalah …", "o": ["Keliru hanya soal tahun: EWS memang khusus PPh, tetapi masa yang dihitung paling lama 5 tahun", "Keliru hanya soal jenis pajak: EWS seluruh jenis pajak, dan masa dihitung sejak kewajiban timbul", "Keliru dua kali: EWS untuk seluruh jenis pajak, dan paling lama 5 tahun ke belakang", "Benar, karena pengawasan dilakukan atas pemenuhan kewajiban sejak timbulnya kewajiban perpajakan"], "a": 2, "e": "Penelitian potensi dengan EWS dilakukan atas seluruh jenis pajak, untuk masa paling lama 5 tahun sebelum tahun berjalan pelaksanaan ekstensifikasi, sejalan dengan daluwarsa penetapan. EWS memuat akun pajak format SPT, hitungan WP, hitungan petugas, dan selisihnya sebagai nilai potensi.", "s": "Slide 785, 795–799", "kw": "EWS", "rk": 1, "hit": "Bab 3 · 2.2 Menghitung potensi dan menerbitkan SPHPP", "nav": ["Beranda", "Bab 3", "Modul 2 · Pelaksanaan", "Pelajaran 2.2 “Menghitung potensi dan menerbitkan SPHPP”", "bagian “Penelitian potensi dengan EWS”"]}, {"b": 3, "q": "CV Tunas menerima SPHPP yang mencantumkan potensi pajak, beserta undangan pembahasan akhir. CV Tunas tidak hadir tanpa kabar. Mana rangkaian akibat yang tepat?", "o": ["Pembahasan dijadwalkan ulang, dan BAP2DK baru dibuat setelah WP hadir dan bersedia menandatanganinya", "Dianggap tidak setuju dengan nilai potensi, sehingga langsung direkomendasikan usul pemeriksaan tanpa BAP2DK", "Dianggap setuju, pembahasan dianggap terlaksana, DJP menghitung kewajiban, BAP2DK cukup ditandatangani AR", "Dianggap menyetujui hasil pengujian, tetapi BAP2DK tetap harus ditandatangani WP dalam 5 hari kerja"], "a": 2, "e": "Kalau WP tidak menghadiri pembahasan akhir, WP dianggap menyetujui hasil pengujian/pengawasan, pembahasan dianggap telah dilaksanakan, dan kewajiban yang masih harus dipenuhi dihitung DJP. BAP2DK cukup ditandatangani AR, dan simpulan akhirnya “WP tidak menghadiri pembahasan akhir”.", "s": "Slide 795–803", "kw": "tidak hadir pembahasan", "rk": 1, "hit": "Bab 3 · 2.2 Menghitung potensi dan menerbitkan SPHPP", "nav": ["Beranda", "Bab 3", "Modul 2 · Pelaksanaan", "Pelajaran 2.2 “Menghitung potensi dan menerbitkan SPHPP”", "bagian “Pembahasan (akhir)”, kotak “Kalau WP tidak hadir pembahasan”; lihat juga pelajaran 2.3"]}, {"b": 3, "q": "Setelah klarifikasi, tim menyimpulkan bahwa penghasilan Nona Sekar ternyata di bawah PTKP dan tidak ada indikasi kewajiban yang masih harus dipenuhi yang ada jumlah pajaknya. Langkah berikutnya yang tepat adalah …", "o": ["Menerbitkan SPHPP tanpa undangan pembahasan, lalu BAP2DK paling lama 2 hari kerja", "Tidak menerbitkan apa pun dan langsung menyusun LHP2DK dengan rekomendasi case closed", "Menerbitkan SPHPP beserta undangan pembahasan akhir dalam 21 hari", "Menerbitkan SP3-P2DK seperti pada P2DK atas WP terdaftar"], "a": 0, "e": "Kalau ada indikasi kewajiban yang ada jumlah pajaknya, terbit SPHPP dan undangan pembahasan. Kalau tidak ada, terbit SPHPP saja, lalu BAP2DK. Menurut ND-498/PJ.06/2025, SPHPP ke BAP2DK tanpa undangan pembahasan paling lama 2 hari kerja. SP3-P2DK adalah penutupan P2DK WP terdaftar.", "s": "Slide 783, 795–799", "kw": "SPHPP", "rk": 1, "hit": "Bab 3 · 2.2 Menghitung potensi dan menerbitkan SPHPP", "nav": ["Beranda", "Bab 3", "Modul 2 · Pelaksanaan", "Pelajaran 2.2 “Menghitung potensi dan menerbitkan SPHPP”", "bagian “Dua kemungkinan hasil penghitungan”"]}, {"b": 3, "q": "Ekstensifikasi atas Tuan Bimo, pedagang grosir, menghasilkan temuan berikut: omzetnya melebihi batas pengusaha kecil, gudang kotanya (objek PBB perdesaan dan perkotaan) belum tercatat di pemda, ia tidak setuju dengan nilai potensi, dan tim menemukan data pemasok baru. Rekomendasi dan tindak lanjut LHP2DK yang tepat adalah …", "o": ["Usul IDLP, ditambah pengukuhan PKP jabatan dan pendaftaran PBB jabatan", "Usul pemeriksaan, ditambah pengukuhan PKP jabatan dan input KPD Form", "Case closed, ditambah pengukuhan PKP jabatan dan input KPD Form", "Usul pemeriksaan, ditambah pencabutan SKT PBB dan input KPD Form"], "a": 1, "e": "Rekomendasi utama LHP2DK: case closed, usul IDLP (ada indikasi pidana), atau usul pemeriksaan (masih ada potensi yang belum dipenuhi). Tindak lanjut tambahan: PKP jabatan kalau ada potensi PPN, pendaftaran PBB jabatan kalau ada objek PBB belum terdaftar, dan input KPD Form kalau ada data baru. Gudang adalah bangunan biasa (PBB-P2, bukan P5L), sehingga di luar pendaftaran PBB jabatan oleh DJP.", "s": "Slide 782, 785, 800, 804", "kw": "KPD Form", "rk": 2, "hit": "Bab 3 · 2.4 Hasil P2DK dan LHP2DK", "nav": ["Beranda", "Bab 3", "Modul 2 · Pelaksanaan", "Pelajaran 2.4 “Hasil P2DK dan LHP2DK”", "bagian “Versi proses bisnis: LHP2DK”"]}, {"b": 3, "q": "Dalam ekstensifikasi atas sebuah badan usaha yang belum terdaftar, tim menemukan bukti badan itu memungut \"PPN\" dari pembelinya dengan dokumen yang menyerupai faktur, tetapi tidak pernah menyetorkannya. Usulan sesuai PMK-111/2025 yang paling tepat adalah …", "o": ["Pemeriksaan bukti permulaan secara langsung oleh tim ekstensifikasi", "Pengembangan dan analisis IDLP, karena ada indikasi tindak pidana perpajakan", "Pemeriksaan untuk menguji kepatuhan, karena badan itu belum terdaftar", "P2DK tidak ditindaklanjuti, karena badan itu bukan PKP dan tidak dapat memungut PPN"], "a": 1, "e": "Hasil P2DK WP belum terdaftar berupa pemberian NPWP/NITKU jabatan dan usulan huruf a–f: case closed, PKP jabatan, PBB jabatan, pembatasan layanan publik, pemeriksaan, dan IDLP kalau ada indikasi tindak pidana perpajakan. Usul bukper langsung tidak termasuk daftar ini; jalurnya lewat intelijen (IDLP).", "s": "Slide 782, 785, 800, 804", "kw": "IDLP", "rk": 1, "hit": "Bab 3 · 2.4 Hasil P2DK dan LHP2DK", "nav": ["Beranda", "Bab 3", "Modul 2 · Pelaksanaan", "Pelajaran 2.4 “Hasil P2DK dan LHP2DK”", "bagian “Versi PMK-111/2025”"]}, {"b": 3, "q": "Pembahasan akhir dengan WP ekstensifikasi dilakukan luring di KPP pada Senin, 7 September 2026. Menurut ND-498/PJ.06/2025, kapan BAP2DK dan LHP2DK paling lambat dibuat?", "o": ["BAP2DK paling lama 5 hari kerja setelah pembahasan, dan LHP2DK 5 hari kerja kemudian", "BAP2DK paling lama 2 hari kerja setelah pembahasan, dan LHP2DK pada hari yang sama", "BAP2DK pada 7 September, dan LHP2DK paling lama 21 hari setelah BAP2DK", "BAP2DK pada 7 September, dan LHP2DK paling lama 5 hari kerja setelah BAP2DK"], "a": 3, "e": "BAP2DK setelah pembahasan luring dibuat pada tanggal yang sama dengan pembahasan. Kalau pembahasannya daring, konsep BAP2DK dikirim dan kembali dalam 5 hari kerja. Dari BAP2DK ke LHP2DK paling lama 5 hari kerja. Angka 21 hari adalah jangka pembahasan dengan undangan.", "s": "Slide 783", "kw": "ND-498", "rk": 1, "hit": "Bab 3 · 2.5 Jangka waktu proses bisnis (ND-498/PJ.06/2025)", "nav": ["Beranda", "Bab 3", "Modul 2 · Pelaksanaan", "Pelajaran 2.5 “Jangka waktu proses bisnis (ND-498/PJ.06/2025)”", "bagian “Garis waktu”"]}, {"b": 3, "q": "Kepala Seksi Pengawasan sebuah KPP menyusun tim ekstensifikasi untuk satu DPE berisiko tinggi: ketua dari AR pengampu, anggota dari AR di seksi pengawasan lain, dan penugasan berdasarkan kedekatan wilayah. SP2DK-nya rencananya akan diantar sendiri oleh tim. Berapa unsur yang tidak sesuai materi?", "o": ["Satu: hanya anggota tim yang harus berasal dari seksi pengawasan yang sama dengan ketuanya", "Dua: anggota harus dari seksi yang sama, dan penugasan harus berdasarkan rekomendasi HRIS", "Tidak ada; susunan tim dan cara penyampaian SP2DK sudah sesuai dengan proses bisnisnya", "Tiga: anggota dari seksi yang sama, penugasan via rekomendasi HRIS, dan SP2DK oleh Fungsional Penyuluh"], "a": 3, "e": "Kepala Seksi Pengawasan meng-assign case kepada 2 petugas berdasarkan rekomendasi HRIS sesuai kompleksitas kasus. Ketuanya AR pengampu atau Kepala KP2KP, anggotanya 1 AR lain dalam seksi pengawasan yang sama. SP2DK untuk WP risiko tinggi disampaikan Fungsional Penyuluh, sedangkan risiko sedang/rendah oleh tim ekstensifikasi.", "s": "Slide 786–787", "kw": "rekomendasi HRIS", "rk": 1, "hit": "Bab 3 · 1.2 Tim ekstensifikasi dan persiapan SP2DK", "nav": ["Beranda", "Bab 3", "Modul 1 · Perencanaan", "Pelajaran 1.2 “Tim ekstensifikasi dan persiapan SP2DK”", "bagian “Penugasan”"]}, {"b": 3, "q": "Tuan Karta tidak melaporkan SPT, tidak dipotong pihak lain, dan tidak membayar pajak selama 5 tahun terakhir. Ia tidak sedang diperiksa dan tidak menerima fasilitas, tetapi masih menunggu putusan banding atas SKPKB lamanya. Dapatkah DJP menetapkannya sebagai WP Nonaktif secara jabatan?", "o": ["Ya, karena ketiga syarat “5 tahun tidak aktif” sudah terpenuhi seluruhnya", "Ya, asalkan putusan bandingnya nanti tidak menambah jumlah pajak terutang", "Tidak, karena status Nonaktif hanya dapat ditetapkan atas permohonan WP sendiri", "Tidak, karena salah satu syaratnya tidak sedang menempuh upaya hukum"], "a": 3, "e": "Penetapan WP Nonaktif secara jabatan memerlukan semua kondisi: 5 tahun tanpa SPT, tanpa dipotong/dipungut, dan tanpa pembayaran; tidak punya tunggakan dan/atau tidak sedang menempuh upaya hukum; tidak sedang diperiksa, bukper, atau disidik; dan tidak mendapat fasilitas atau insentif.", "s": "Slide 807–811", "kw": "Nonaktif secara jabatan", "rk": 1, "hit": "Bab 3 · 3.1 WP Nonaktif, NA TD, dan imbauan massal", "nav": ["Beranda", "Bab 3", "Modul 3 · WP Nonaktif Terdapat Data", "Pelajaran 3.1 “WP Nonaktif, NA TD, dan imbauan massal”", "bagian “Penetapan WP Nonaktif secara jabatan”"]}, {"b": 4, "q": "Tiga pegawai DJP merekam data: (1) seorang Penilai, saat penilaian lapangan atas sebuah pabrik, melihat gudang besar milik pihak lain di sebelahnya; (2) pegawai bagian umum KPP, saat berlibur, melihat resort baru yang ramai; (3) AR menganalisis laporan keuangan para penerima fasilitas sesuai Daftar Prioritas KPD. Jenis KPD masing-masing adalah …", "o": ["(1) KPD tusi lainnya; (2) KPD non tusi; (3) KPD analisis", "(1) KPD berbasis kewilayahan; (2) KPD non tusi; (3) KPD analisis", "(1) KPD tusi lainnya; (2) KPD eksternal; (3) KPD berbasis kewilayahan", "(1) KPD non tusi; (2) KPD non tusi; (3) KPD tusi lainnya"], "a": 0, "e": "Pembedanya siapa yang mengumpulkan dan dalam rangka apa. Penilai yang menemukan data saat penilaian lapangan melakukan KPDL berbasis penugasan lapangan lainnya (KPD tusi lainnya). Pegawai yang menemukan data di luar tugasnya melakukan KPD non tusi. Analisis laporan keuangan dan penerima fasilitas sesuai Daftar Prioritas KPD adalah KPD analisis. KPD eksternal dilakukan pihak luar berdasarkan PKS.", "s": "Slide 839–843", "kw": "KPD non tusi", "rk": 1, "hit": "Bab 4 · 1.1 Jenis-jenis KPD", "nav": ["Beranda", "Bab 4", "Modul 1 · Kegiatan Pengumpulan Data", "Pelajaran 1.1 “Jenis-jenis KPD”", "bagian “Empat jenis KPD + KPD eksternal”, lihat juga “KPDL tusi: dua bentuk” dan “KPDL non tusi”"]}, {"b": 4, "q": "Karena kekurangan pegawai, seorang AR melakukan KPDL sendirian pada hari Sabtu di sebuah kawasan pasar, berpakaian bebas, dengan membawa Surat Tugas tetapi tanpa penugasan pimpinan untuk bekerja di luar jam kerja. Mana pernyataan yang tepat?", "o": ["Sesuai, karena AR sudah membawa Surat Tugas yang menjadi dasar resmi untuk turun ke lapangan", "Tidak sesuai hanya karena dilakukan hari Sabtu; jumlah dan pakaian petugas tidak diatur", "Sesuai, karena keterbatasan sumber daya adalah pertimbangan sah untuk melaksanakan KPDL ad hoc", "Tidak sesuai: minimal 2 orang berpakaian kerja, dan di luar jam kerja perlu penugasan pimpinan"], "a": 3, "e": "Aturan pelaksanaan KPDL: koordinasi dengan pihak setempat; dilakukan minimal 2 orang, berpakaian kerja, dengan tanda pengenal, Surat Tugas, dan dokumen terkait; pada hari dan jam kerja, atau di luar itu berdasarkan penugasan pimpinan unit. Keterbatasan sumber daya adalah pertimbangan membentuk KPDL ad hoc/tim, bukan alasan mengurangi jumlah petugas.", "s": "Slide 844–845, 847", "kw": "minimal 2 orang", "rk": 2, "hit": "Bab 4 · 1.2 Dari lapangan sampai SP2DK: proses bisnis KPDL", "nav": ["Beranda", "Bab 4", "Modul 1 · Kegiatan Pengumpulan Data", "Pelajaran 1.2 “Dari lapangan sampai SP2DK: proses bisnis KPDL”", "bagian “Tahap 1: di lapangan”, subbagian “Aturan pelaksanaan KPDL”"]}, {"b": 4, "q": "Data KPDL yang direkam seorang AR sudah lengkap, relevan dengan klasifikasi ICALEP, dan nilainya akurat. Tetapi ternyata data itu sudah ada di basis data DJP, dan tahun pajaknya sudah daluwarsa. Pada lapis mana dan oleh siapa data ini seharusnya tersaring?", "o": ["Validasi material oleh atasan langsung", "Validasi formal oleh atasan langsung", "Validasi formal oleh Kasi PKD", "Validasi material oleh Direktorat DIP"], "a": 2, "e": "Validasi material oleh atasan langsung menguji kelengkapan, relevansi (ICALEP), dan akurasi. Validasi formal oleh Kasi PKD menguji validitas NPWP/NIK, standar penulisan nama dan alamat, bahwa data belum ada di basis data DJP, dan bahwa masa/tahun pajaknya belum daluwarsa. Direktorat DIP baru mengolah data setelah itu.", "s": "Slide 844–845, 847", "kw": "validasi formal", "rk": 1, "hit": "Bab 4 · 1.2 Dari lapangan sampai SP2DK: proses bisnis KPDL", "nav": ["Beranda", "Bab 4", "Modul 1 · Kegiatan Pengumpulan Data", "Pelajaran 1.2 “Dari lapangan sampai SP2DK: proses bisnis KPDL”", "bagian “Tahap 2: penjaminan kualitas data (dua lapis validasi)”"]}, {"b": 4, "q": "Setelah diolah Direktorat DIP, dua data KPDL diturunkan ke KPP: (1) data usaha kos-kosan milik orang yang belum ber-NPWP; (2) data penjualan alat berat oleh PT yang sudah ber-NPWP. Alur tindak lanjut yang tepat adalah …", "o": ["(1) menjadi data penguji untuk SP2DK; (2) masuk DSE untuk ekstensifikasi lebih dulu", "(1) masuk DSE untuk ekstensifikasi; (2) menjadi data penguji untuk SP2DK", "(1) langsung diberi NPWP jabatan oleh DIP; (2) langsung diusulkan untuk pemeriksaan", "Keduanya masuk DSE, lalu dipilah oleh Komite Kepatuhan menjadi DPE atau DPP"], "a": 1, "e": "DIP memilah data yang diturunkan ke KPP. Data atas pihak belum ber-NPWP masuk DSE untuk ekstensifikasi, lalu didistribusikan Kasi PKD dan ditindaklanjuti AR dengan SP2DK hingga LHP2DK. Data atas WP ber-NPWP menjadi data penguji untuk intensifikasi, lalu ditindaklanjuti dengan SP2DK.", "s": "Slide 844–845, 847", "kw": "data penguji", "rk": 1, "hit": "Bab 4 · 1.2 Dari lapangan sampai SP2DK: proses bisnis KPDL", "nav": ["Beranda", "Bab 4", "Modul 1 · Kegiatan Pengumpulan Data", "Pelajaran 1.2 “Dari lapangan sampai SP2DK: proses bisnis KPDL”", "bagian “Tahap 3: pengolahan di Direktorat DIP”"]}, {"b": 4, "q": "Saat KPD berbasis wilayah, seorang AR menemukan: (1) usaha WP yang tidak lagi memenuhi syarat fasilitas yang sedang dinikmatinya; (2) data transaksi properti tanpa subjek yang dapat ditemukan; (3) sebidang lahan milik WP yang nilainya tidak diketahui. Tindak lanjut lewat Action Selection yang tepat adalah …", "o": ["(1) usulan pencabutan/perubahan fasilitas; (2) permintaan bantuan pengamatan/intelijen; (3) permintaan bantuan penilaian", "(1) pencabutan fasilitas langsung oleh AR; (2) NPWP jabatan atas nama penjual; (3) permintaan bantuan penilaian", "(1) usulan pencabutan/perubahan fasilitas; (2) permintaan bantuan penilaian; (3) permintaan bantuan pengamatan/intelijen", "(1) perubahan status WP secara jabatan; (2) permintaan bantuan pengamatan/intelijen; (3) pemeriksaan lapangan"], "a": 0, "e": "Continuous supervision membuat KPD dapat langsung memicu tindakan. Fasilitas yang tidak seharusnya dinikmati ditindaklanjuti dengan usulan pencabutan/perubahan fasilitas, bukan dicabut langsung. Data tanpa subjek yang ditemukan ditindaklanjuti dengan permintaan bantuan pengamatan/intelijen. Data yang nilainya tidak diketahui ditindaklanjuti dengan permintaan bantuan penilaian.", "s": "Slide 846", "kw": "bantuan pengamatan", "rk": 1, "hit": "Bab 4 · 1.3 Continuous supervision: KPD yang langsung bertindak", "nav": ["Beranda", "Bab 4", "Modul 1 · Kegiatan Pengumpulan Data", "Pelajaran 1.3 “Continuous supervision: KPD yang langsung bertindak”", "bagian “Kondisi dan tindak lanjutnya”"]}, {"b": 4, "q": "Saat menyusun profil PT Sinar, AR mencatat: (1) KLU dan susunan pemegang saham; (2) riwayat pemeriksaan dan laporan keuangan lima tahun; (3) berita media tentang ekspansi pabriknya. Klasifikasi data profil yang tepat adalah …", "o": ["(1) akumulatif; (2) akumulatif; (3) permanen", "(1) permanen; (2) akumulatif; (3) lainnya", "(1) permanen; (2) lainnya; (3) akumulatif", "(1) permanen; (2) permanen; (3) lainnya"], "a": 1, "e": "Profil WP adalah rangkaian data fiskal yang berkesinambungan. Data permanen jarang berubah (akta, NPWP, alamat, pemegang saham, KLU). Data akumulatif bertambah tiap tahun (SPT, pembayaran, laporan keuangan, riwayat pemeriksaan). Data lainnya adalah pelengkap (berita media, hasil kunjungan, data pihak ketiga).", "s": "Slide 848–850", "kw": "data akumulatif", "rk": 1, "hit": "Bab 4 · 2.1 Profil Wajib Pajak: isi dan tujuannya", "nav": ["Beranda", "Bab 4", "Modul 2 · Profiling Wajib Pajak", "Pelajaran 2.1 “Profil Wajib Pajak: isi dan tujuannya”", "bagian “Pengertian”"]}, {"b": 4, "q": "Saat memetakan proses bisnis PT Niaga, AR menemukan bahwa barang dikirim dari gudang ke tiga outlet cabang lalu langsung ke pelanggan, sedangkan seluruh faktur dan pembayaran tercatat di kantor pusat. Salah satu outlet belum punya NITKU. Mengapa arus barang dan arus dokumen/uang perlu dipetakan terpisah dalam kasus ini?", "o": ["Karena arus barang menentukan tempat terutang PPh Badan, sedangkan arus uang menentukan tempat terutang PPN", "Karena keduanya tidak selalu melewati jalur yang sama, sehingga titik omzet yang bisa “bocor” di outlet dapat ditemukan", "Karena hanya arus uang yang relevan untuk pajak, sedangkan arus barang cukup untuk kepentingan audit internal", "Karena outlet tanpa NITKU otomatis dianggap sebagai WP terpisah yang wajib punya NPWP sendiri"], "a": 1, "e": "Langkah 03 profiling menggambarkan arus barang dan arus dokumen/uang. Keduanya dipisah karena tidak selalu sejalur: barang bisa dikirim dari gudang atau outlet, sementara faktur dan pembayaran lewat pusat. Pemetaan ini membantu menjawab apakah penjualan outlet tercatat di pusat dan apakah outlet sudah punya NITKU.", "s": "Slide 851–858", "kw": "arus barang", "rk": 1, "hit": "Bab 4 · 2.2 Approach one: mengenal WP dari luar ke dalam", "nav": ["Beranda", "Bab 4", "Modul 2 · Profiling Wajib Pajak", "Pelajaran 2.2 “Approach one: mengenal WP dari luar ke dalam”", "bagian “03 · Proses bisnis WP”"]}, {"b": 4, "q": "Hasil ekualisasi PT Fajar menunjukkan tiga selisih: (1) omzet di SPT PPh lebih besar daripada di SPT PPN karena ada penjualan jasa yang bukan objek PPN; (2) biaya gaji di laporan keuangan jauh melebihi penghasilan bruto di SPT PPh 21; (3) biaya sewa gedung kantor besar, tetapi tidak ada bukti potong PPh Final 4(2). Selisih yang sudah terjelaskan oleh fakta dalam kasus, sehingga tidak perlu dimintakan penjelasan lewat SP2DK, adalah …", "o": ["Hanya selisih (2), karena biaya gaji dapat mencakup tunjangan yang bukan objek PPh 21", "Hanya selisih (1), karena penyerahan yang bukan objek PPN memang tidak masuk SPT PPN", "Selisih (1) dan (3), karena sewa gedung dapat dibayar kepada pihak yang dikecualikan", "Ketiganya, karena ekualisasi hanya alat bantu dan tidak pernah menunjukkan indikasi"], "a": 1, "e": "Ekualisasi mencocokkan angka yang seharusnya sama atau berhubungan: omzet SPT PPN vs SPT PPh (setelah memperhitungkan penyerahan bukan objek PPN), biaya gaji vs PPh 21, dan biaya sewa vs PPh 23/Final 4(2). Selisih (1) dijelaskan langsung oleh penyerahan bukan objek PPN. Selisih (2) dan (3) adalah pertanyaan yang wajar dimasukkan dalam SP2DK.", "s": "Slide 852, 859–860", "kw": "ekualisasi", "rk": 1, "hit": "Bab 4 · 2.3 Approach two: jembreng SPT PPN, ekualisasi, dan analisis laporan keuangan", "nav": ["Beranda", "Bab 4", "Modul 2 · Profiling Wajib Pajak", "Pelajaran 2.3 “Approach two: jembreng SPT PPN, ekualisasi, dan analisis laporan keuangan”", "bagian “07 · Ekualisasi”"]}, {"b": 5, "q": "Sistem menyalakan tiga alarm untuk tiga WP: (1) faktur keluaran PT Ruby sudah disetujui sistem, tetapi tidak dilaporkan di SPT Masa PPN; (2) Tuan Arif mengkreditkan angsuran PPh 25 yang tidak ada setorannya di MPN; (3) laba komersial di SPT PT Opal berbeda dari laporan keuangan yang diaudit KAP. Kelompok data pemicu masing-masing adalah …", "o": ["(1) Kelompok A; (2) Kelompok B; (3) Kelompok D", "(1) Kelompok C; (2) Kelompok B; (3) Kelompok C", "(1) Kelompok D; (2) Kelompok A; (3) Kelompok B", "(1) Kelompok C; (2) Kelompok A; (3) Kelompok D"], "a": 3, "e": "Pola 28 data pemicu: A membandingkan yang dilaporkan dibayar dengan MPN; B membandingkan kredit pajak di SPT dengan setoran pemotongnya; C masalah PPN/PM (faktur approve belum lapor, faktur diganti/batal/ganda, NTPN dobel); D lainnya (EOI rekening luar negeri, laba SPT vs audit KAP). Kredit angsuran PPh 25 tanpa setoran di MPN masuk A, karena pembandingnya MPN, bukan pemotong lain.", "s": "Slide 700–701", "kw": "data pemicu", "rk": 1, "hit": "Bab 5 · 1.1 28 data pemicu", "nav": ["Beranda", "Bab 5", "Modul 1 · Data pemicu dan analisis mandiri", "Pelajaran 1.1 “28 data pemicu”", "bagian “Kelompok C · Masalah PPN dan Pajak Masukan”, bandingkan dengan Kelompok A dan D"]}, {"b": 5, "q": "Dalam analisis mandiri atas PT Garnet, AR menemukan: (1) truk dan mobil operasional disusutkan dengan masa manfaat 4 tahun; (2) lebih bayar PPN yang dikompensasikan dari Masa Maret berbeda dengan kompensasi yang diterima Masa April. Titik masuk analisis yang menemukan masing-masing temuan adalah …", "o": ["(1) analisis laporan keuangan dengan rasio GPM; (2) ekualisasi omzet PPN vs PPh", "(1) penyusutan yang tidak sesuai golongan; (2) jembreng PPN, karena kompensasi tidak nyambung", "(1) penyusutan yang tidak sesuai golongan; (2) data pemicu kelebihan kompensasi oleh pemotong", "(1) data penguji dan kunjungan; (2) jembreng PPN, karena PPN disetor di masa yang sama"], "a": 1, "e": "Titik masuk analisis mandiri: ekualisasi, jembreng PPN, penyusutan, analisis laporan keuangan, serta data penguji dan kunjungan. Kendaraan seperti mobil termasuk kelompok 2 (8 tahun); kalau disusutkan sebagai kelompok 1 (4 tahun), biaya per tahun membengkak. Jembreng PPN sering menemukan kompensasi yang tidak nyambung antarmasa.", "s": "Slide 702", "kw": "penyusutan", "rk": 2, "hit": "Bab 5 · 1.2 Analisis mandiri", "nav": ["Beranda", "Bab 5", "Modul 1 · Data pemicu dan analisis mandiri", "Pelajaran 1.2 “Analisis mandiri”", "bagian “Lima titik masuk dari slide”"]}, {"b": 5, "q": "AR tidak punya data penjualan sebuah usaha laundry kiloan, yang transaksinya hampir seluruhnya tunai. AR hanya tahu pemakaian deterjen per bulan dari faktur pemasok, dan dari wawancara diketahui berapa kilogram cucian yang bisa dicuci per kilogram deterjen. Pendekatan dan urutan logika yang tepat adalah …", "o": ["Satuan/volume: volume input × persentase output, diproyeksikan setahun, lalu dikalikan harga per kilogram", "Rasio: pembelian deterjen dibagi rasio HPP usaha sejenis untuk langsung mendapat peredaran usaha", "Biaya hidup: pengeluaran deterjen dianggap sebagai pengeluaran minimal yang harus ditutup penghasilan", "Pertambahan kekayaan bersih: deterjen dicatat sebagai harta, lalu ditambahkan biaya hidup pemilik"], "a": 0, "e": "Pendekatan satuan/volume menerapkan harga atau laba terhadap volume usaha. Kalau yang diketahui hanya input, volume periode teridentifikasi = volume input × persentase untuk menghasilkan output, lalu diproyeksikan setahun dan dikalikan harga jual.", "s": "Slide 708–711", "kw": "volume input", "rk": 1, "hit": "Bab 5 · 2.2 Delapan pendekatan menghitung omzet", "nav": ["Beranda", "Bab 5", "Modul 2 · Galpot orang pribadi", "Pelajaran 2.2 “Delapan pendekatan menghitung omzet”", "bagian “Pendekatan satuan dan/atau volume”"]}, {"b": 5, "q": "Untuk menguji omzet sebuah toko kue artisan yang menjual produk premium dalam jumlah kecil, AR berencana memakai rasio HPP terhadap penjualan rata-rata jaringan minimarket, karena hanya rasio itu yang tersedia di sistem. Penilaian yang tepat adalah …", "o": ["Tepat, karena pendekatan rasio boleh memakai rasio apa pun yang tersedia di sistem DJP", "Tepat, asalkan hasilnya nanti dikonfirmasi ulang dengan pendekatan biaya hidup pemiliknya", "Kurang tepat, karena usaha WP harus memang sebanding dengan rasio pembandingnya", "Kurang tepat, karena pendekatan rasio hanya boleh memakai rasio dari WP itu sendiri"], "a": 2, "e": "Pendekatan rasio dipakai kalau ada data pembanding atau rasio, dari DJP, WP sendiri, maupun pihak lain, dan kegiatan usaha WP memang dapat dibandingkan dengan rasio itu. Minimarket dan toko kue premium berbeda karakter margin dan biayanya, sehingga rasionya tidak sebanding.", "s": "Slide 708–711", "kw": "pendekatan rasio", "rk": 1, "hit": "Bab 5 · 2.2 Delapan pendekatan menghitung omzet", "nav": ["Beranda", "Bab 5", "Modul 2 · Galpot orang pribadi", "Pelajaran 2.2 “Delapan pendekatan menghitung omzet”", "bagian “Pendekatan rasio”"]}, {"b": 5, "q": "Tuan Harsa tidak punya utang. Sepanjang tahun, keluarganya mengeluarkan uang untuk: (1) uang sekolah dua anak; (2) perawatan tiga mobil; (3) penempatan deposito baru; (4) zakat dan sumbangan; (5) cicilan pembelian kavling. Pengeluaran yang tidak dihitung sebagai biaya hidup adalah …", "o": ["(3) dan (5), karena keduanya pengeluaran untuk menambah kekayaan", "(4) saja, karena sumbangan bukan pengeluaran rutin rumah tangga", "(2) dan (3), karena keduanya berkaitan dengan harta", "(5) saja, karena cicilan merupakan pembayaran utang"], "a": 0, "e": "Biaya hidup adalah seluruh pengeluaran tidak termasuk pengeluaran untuk menambah kekayaan. Kelompoknya antara lain konsumsi, transportasi, pendidikan, kesehatan, rekreasi, gaya hidup, sumbangan, olahraga, pemeliharaan harta, dan pajak. Deposito dan kavling menambah kekayaan, sedangkan perawatan mobil adalah pemeliharaan harta. Tanpa utang, penghasilan minimal sama dengan biaya hidup.", "s": "Slide 712–714", "kw": "biaya hidup", "rk": 1, "hit": "Bab 5 · 2.3 Biaya hidup dan pertambahan kekayaan bersih", "nav": ["Beranda", "Bab 5", "Modul 2 · Galpot orang pribadi", "Pelajaran 2.3 “Biaya hidup dan pertambahan kekayaan bersih”", "bagian “Metode penghitungan biaya hidup”"]}, {"b": 5, "q": "Dengan metode pertambahan kekayaan bersih ditambah biaya hidup, AR menghitung bahwa penghasilan Nyonya Lestari seharusnya jauh di atas yang ia laporkan. Ternyata tahun itu Nyonya Lestari juga menerima warisan dari ayahnya dan bunga deposito. Sebelum menyimpulkan ada penghasilan yang tidak dilaporkan, AR harus …", "o": ["Menambahkan warisan dan bunga deposito sebagai penghasilan yang belum dilaporkan", "Mengurangkan dulu penghasilan yang sudah dilaporkan, bukan objek, dan final", "Mengabaikan warisan, karena metode ini hanya menghitung penghasilan dari kegiatan usaha", "Mengganti metode dengan pendekatan rasio, karena ada penghasilan yang bukan dari usaha"], "a": 1, "e": "Penghasilan = pertambahan kekayaan bersih + biaya hidup. Hasilnya mencakup semua sumber, termasuk yang bukan objek pajak atau sudah dikenai pajak final, misalnya warisan, hibah dari keluarga sedarah, atau bunga deposito. Penghasilan tersebut dan yang sudah dilaporkan dikurangkan dulu.", "s": "Slide 712–714", "kw": "kekayaan bersih", "rk": 1, "hit": "Bab 5 · 2.3 Biaya hidup dan pertambahan kekayaan bersih", "nav": ["Beranda", "Bab 5", "Modul 2 · Galpot orang pribadi", "Pelajaran 2.3 “Biaya hidup dan pertambahan kekayaan bersih”", "bagian “Metode pertambahan kekayaan bersih”"]}, {"b": 5, "q": "Sejak 1 Agustus 2025, mana di antara transaksi berikut yang dipungut PPh Pasal 22 sebesar 0,25%?", "o": ["LJK penyelenggara usaha bulion membeli emas batangan senilai Rp50 juta dari seorang penjual", "Pengusaha emas menjual emas batangan senilai Rp200 juta kepada LJK penyelenggara usaha bulion", "LJK penyelenggara usaha bulion membeli emas batangan senilai Rp8 juta dari seorang penjual", "Pengusaha emas menjual emas batangan kepada pembeli yang memiliki SKB pemungutan PPh 22"], "a": 0, "e": "PMK-51/2025 dan PMK-52/2025: pembelian emas batangan oleh LJK bulion dipungut PPh 22 0,25% dari harga pembelian, kecuali pembayaran sampai Rp10 juta. Penjualan emas batangan kepada LJK bulion dikecualikan agar tidak terpungut dua kali. Penjualan kepada konsumen akhir, WP PPh final UMKM, dan pemegang SKB juga tidak dipungut.", "s": "Slide 715–718; PMK-51/2025, PMK-52/2025", "kw": "bulion", "rk": 1, "hit": "Bab 5 · 3.1 Sektor perdagangan dan industri emas perhiasan", "nav": ["Beranda", "Bab 5", "Modul 3 · Galpot per sektor", "Pelajaran 3.1 “Sektor perdagangan dan industri emas perhiasan”", "bagian “PPh 22 emas (PMK-48/2023)”, kotak perubahan PMK-51/2025 dan PMK-52/2025"]}, {"b": 5, "q": "Toko Mas Kencana, PKP pedagang emas perhiasan, menjual perhiasan kepada konsumen akhir. Sebagian stoknya dibeli dari perorangan tanpa faktur pajak atau dokumen tertentu yang lengkap. Toko itu juga ingin mengkreditkan PPN atas pembelian etalase barunya. Perlakuan yang tepat adalah …", "o": ["PPN 1,1% dari harga jual karena pembelinya konsumen akhir, dan Pajak Masukan etalase dapat dikreditkan", "PPN 1,65% dari harga jual, dan Pajak Masukan etalase tetap dapat dikreditkan karena bukan emas", "PPN 1,65% dari harga jual untuk perhiasan tanpa dokumen lengkap, dan Pajak Masukannya tidak dapat dikreditkan", "PPN tarif umum karena tidak ada dokumen perolehan, dan Pajak Masukan dapat dikreditkan"], "a": 2, "e": "Penyerahan emas perhiasan kepada konsumen akhir oleh pabrikan atau pedagang dikenai PPN besaran tertentu 1,1% kalau PKP punya faktur atau dokumen tertentu lengkap atas perolehan, dan 1,65% kalau tidak. Dengan skema besaran tertentu, Pajak Masukan tidak dapat dikreditkan.", "s": "Slide 715–718", "kw": "besaran tertentu", "rk": 2, "hit": "Bab 5 · 3.1 Sektor perdagangan dan industri emas perhiasan", "nav": ["Beranda", "Bab 5", "Modul 3 · Galpot per sektor", "Pelajaran 3.1 “Sektor perdagangan dan industri emas perhiasan”", "bagian “PPN emas perhiasan (PMK-48/2023)”"]}, {"b": 5, "q": "Sebuah bank mengakui bunga kredit bermasalah (NPL) dengan cash basis, tetapi tidak melampirkan addendum perjanjian dengan debitur di SPT Tahunannya. Bank itu juga menghapus buku sejumlah piutang. Langkah penggalian potensi yang tepat adalah …", "o": ["Terima cash basis karena kolektibilitas kredit mengikuti ketentuan BI, dan abaikan data write off", "Koreksi seluruh piutang yang dihapus buku tanpa perlu meneliti daftar nominatifnya lebih dulu", "Hentikan penggalian, karena rincian kredit dilindungi kerahasiaan bank dalam kegiatan pengawasan", "Uji bunga NPL yang tidak didukung addendum, dan kirim data write off sebagai alket ke KPP debitur"], "a": 3, "e": "Menurut KEP-184/PJ/2002 dan SE-08/PJ/2002, bunga NPL boleh diakui saat diterima kalau ada addendum antara bank dan debitur yang dilampirkan di SPT Tahunan. Data write off dapat dikirim sebagai alket ke KPP tempat debitur terdaftar, untuk mengukur profil ekonomi debitur dan menelusuri penggunaan pinjamannya.", "s": "Slide 733–738", "kw": "addendum", "rk": 1, "hit": "Bab 5 · 3.2 Sektor perbankan: bank umum swasta nasional devisa", "nav": ["Beranda", "Bab 5", "Modul 3 · Galpot per sektor", "Pelajaran 3.2 “Sektor perbankan: bank umum swasta nasional devisa”", "bagian “Teknik penggalian potensi”"]}, {"b": 5, "q": "Model CRM sektor rokok menandai CV Asap Jaya. Statusnya non-efektif, tetapi ia rutin memesan pita cukai CK1 ke DJBC, dan total Harga Jual Ecerannya sudah lebih dari Rp4,8 miliar setahun. CV Asap Jaya belum dikukuhkan sebagai PKP. Mana pernyataan yang tepat?", "o": ["Keduanya prediktor klaster biaya dan utang, karena pita cukai adalah biaya produksi pabrik rokok", "Keduanya klaster profil; pita cukai × HJE adalah pendekatan volume dengan data pihak ketiga", "Keduanya prediktor klaster peredaran usaha, karena HJE dibandingkan dengan DPP PPN keluarannya", "Prediktor ini tidak dapat dipakai, karena status non-efektif menghentikan seluruh kewajiban pajaknya"], "a": 1, "e": "Di model rokok, klaster profil antara lain berisi WP non-efektif yang punya pesanan pita cukai CK1, dan total HJE CK1 di atas Rp4,8 miliar tetapi belum/terlambat PKP. Setiap batang rokok legal memakai pita cukai, sehingga jumlah pita × HJE memberi perkiraan omzet yang kuat, yaitu pendekatan satuan/volume dengan data DJBC.", "s": "Slide 739–751", "kw": "pita cukai", "rk": 1, "hit": "Bab 5 · 3.3 CRM specific risk: sektor rokok dan otomotif", "nav": ["Beranda", "Bab 5", "Modul 3 · Galpot per sektor", "Pelajaran 3.3 “CRM specific risk: sektor rokok dan otomotif”", "bagian “Sektor rokok”"]}, {"b": 5, "q": "Pada 2026, Nyonya Fira memperoleh omzet toko pakaian Rp3 miliar, penghasilan endorsement sebagai selebgram Rp1,2 miliar, dan honor endorsement dari merek luar negeri Rp0,8 miliar. Perlakuan PPh yang tepat untuk omzet toko pakaiannya adalah …", "o": ["PPh final 0,5%, karena hanya omzet toko pakaian yang dihitung untuk batas Rp4,8 miliar", "PPh final 0,5%, karena penghasilan dari luar negeri tidak dihitung dalam batas Rp4,8 miliar", "Tarif umum Pasal 17, tetapi hanya atas bagian omzet toko yang melebihi Rp4,8 miliar", "Tarif umum, karena seluruh omzet usaha dan pekerjaan bebas, termasuk luar negeri, Rp5 miliar"], "a": 3, "e": "PP 20/2026 menghitung batas Rp4,8 miliar dari seluruh peredaran bruto usaha dan pekerjaan bebas, final maupun tidak, termasuk dari luar negeri. Totalnya Rp5 miliar, sehingga Nyonya Fira bukan WP PBT dan omzet tokonya dikenai tarif umum. Penghasilan selebgram memang termasuk jasa pekerjaan bebas (Pasal 56 ayat 4).", "s": "Slide 719–732", "kw": "Pasal 58", "rk": 1, "hit": "Bab 5 · 4.1 PP 20/2026: perubahan PPh final UMKM", "nav": ["Beranda", "Bab 5", "Modul 4 · PP 20/2026 dan transfer pricing", "Pelajaran 4.1 “PP 20/2026: perubahan PPh final UMKM”", "bagian “3 · Pasal 58: omzet mana yang dihitung untuk batas Rp4,8 miliar?”, lihat juga “1 · Pasal 56(4)”"]}, {"b": 5, "q": "Pada 2026, tiga WP ingin memakai PPh final 0,5%: (1) CV Mekar, terdaftar 2024 dan sudah memakai 0,5% sejak itu; (2) PT perorangan milik Tuan Yoga beromzet Rp3 miliar, sementara usaha pribadi Tuan Yoga beromzet Rp2,5 miliar; (3) Tuan Lukas, OP yang memakai 0,5% sejak terdaftar pada 2018. Penilaian yang tepat adalah …", "o": ["(1) tidak boleh lagi sejak PP 20/2026 berlaku; (2) hanya PT perorangan yang boleh; (3) tidak boleh karena sudah lewat 7 tahun", "(1) boleh sampai jangka 4 tahunnya habis; (2) hanya Tuan Yoga yang boleh; (3) tidak boleh karena sudah lewat 7 tahun", "(1) boleh sampai jangka 4 tahunnya habis; (2) tidak boleh, baik PT perorangan maupun Tuan Yoga; (3) boleh tanpa batas waktu", "(1) boleh tanpa batas waktu; (2) keduanya boleh karena masing-masing di bawah Rp4,8 miliar; (3) boleh tanpa batas waktu"], "a": 2, "e": "PP 20/2026 membatasi subjek 0,5% pada OP, PT perorangan, dan koperasi. CV yang sudah memakainya boleh lanjut sampai jangka 4 tahun PP 55/2022 berakhir. PT perorangan bersama OP pemiliknya yang omzet gabungannya lebih dari Rp4,8 miliar dikecualikan. Jangka waktu untuk OP dan PT perorangan dihapus.", "s": "Slide 719–732", "kw": "PT perorangan", "rk": 1, "hit": "Bab 5 · 4.1 PP 20/2026: perubahan PPh final UMKM", "nav": ["Beranda", "Bab 5", "Modul 4 · PP 20/2026 dan transfer pricing", "Pelajaran 4.1 “PP 20/2026: perubahan PPh final UMKM”", "bagian “2 · Pasal 57: siapa yang boleh memakai 0,5%”, lihat juga “4 · Pasal 59” dan “5 · Ketentuan peralihan”"]}, {"b": 5, "q": "PT Amerta membeli bahan baku dari tiga pemasok: PT B milik mertua direktur utama PT Amerta, PT C milik sepupu direktur utama, dan PT D yang pengurusnya sama sekali tidak terkait. Tidak ada kepemilikan saham silang. Pemasok yang memiliki hubungan istimewa dengan PT Amerta karena hubungan keluarga adalah …", "o": ["PT B saja, karena mertua semenda satu derajat, sedangkan sepupu bukan", "PT B dan PT C, karena keduanya dimiliki keluarga dekat direktur utama PT Amerta", "PT C saja, karena sepupu adalah keluarga sedarah, sedangkan mertua hanya semenda", "Tidak ada, karena hubungan istimewa hanya timbul dari kepemilikan modal minimal 25%"], "a": 0, "e": "Hubungan istimewa timbul dari kepemilikan modal (minimal 25%), penguasaan, atau keluarga sedarah/semenda dalam garis lurus dan/atau ke samping satu derajat: orang tua, anak, saudara kandung, mertua, menantu, ipar. Sepupu berada di luar satu derajat.", "s": "Slide 752–756, 768–775", "kw": "semenda", "rk": 3, "hit": "Bab 5 · 4.2 Transfer pricing (PMK-172/2023): hubungan istimewa dan PKKU", "nav": ["Beranda", "Bab 5", "Modul 4 · PP 20/2026 dan transfer pricing", "Pelajaran 4.2 “Transfer pricing (PMK-172/2023): hubungan istimewa dan PKKU”", "bagian “Hubungan istimewa (Pasal 2)”, subbagian “Keluarga sedarah atau semenda”"]}, {"b": 5, "q": "PT Lokal membayar management fee kepada induknya di luar negeri. Rinciannya meliputi biaya audit dan konsolidasi laporan keuangan grup, biaya rapat pemegang saham induk, dan biaya pencatatan saham induk di bursa. Bagaimana perlakuannya menurut PMK-172/2023?", "o": ["Memenuhi PKKU, asalkan harganya berada dalam rentang kewajaran para pembanding", "Memenuhi PKKU, karena seluruh biaya grup memang boleh dialokasikan ke anak perusahaan", "Tidak memenuhi PKKU, karena itu shareholder activity yang gagal tahap pendahuluan", "Harus diuji dulu dengan metode CUP, karena jasa tersebut ada pembandingnya di pasar"], "a": 2, "e": "Untuk transaksi jasa, WP harus lebih dulu membuktikan jasa itu nyata, dibutuhkan, dan bermanfaat, serta bukan shareholder activity, passive association, duplikasi, atau manfaat insidental. Audit dan konsolidasi induk, RUPS induk, dan pencatatan saham induk adalah shareholder activity. Kalau tahapan pendahuluan tidak terpenuhi, transaksi langsung dianggap tidak memenuhi PKKU.", "s": "Slide 752–756, 768–775", "kw": "shareholder activity", "rk": 1, "hit": "Bab 5 · 4.2 Transfer pricing (PMK-172/2023): hubungan istimewa dan PKKU", "nav": ["Beranda", "Bab 5", "Modul 4 · PP 20/2026 dan transfer pricing", "Pelajaran 4.2 “Transfer pricing (PMK-172/2023): hubungan istimewa dan PKKU”", "bagian “Tahapan pendahuluan untuk transaksi tertentu (Pasal 13)”"]}, {"b": 5, "q": "Untuk menguji harga jual PT Sentra kepada afiliasinya, tersedia transaksi PT Sentra sendiri dengan pihak independen yang setara keandalannya, dan lima pembanding eksternal. Harga afiliasinya ternyata di luar rentang, dan titik paling tepat dalam rentang tidak dapat ditentukan. Mana yang tepat?", "o": ["Eksternal diutamakan karena jumlahnya lebih banyak, dan harga disesuaikan ke kuartil yang terdekat", "Internal diutamakan, dan harga disesuaikan ke nilai minimum rentang penuh (minimum–maksimum)", "Internal diutamakan; dengan 3 atau lebih pembanding, harga disesuaikan ke median rentang interkuartil", "Eksternal diutamakan, dan harga disesuaikan ke nilai rata-rata hitung seluruh pembanding yang ada"], "a": 2, "e": "Kalau setara, pembanding internal diutamakan atas eksternal, dan pembanding lokal atas asing. Rentang dari 2 pembanding memakai minimum–maksimum, dari 3 atau lebih memakai kuartil 1–kuartil 3. Kalau tidak memenuhi PKKU, harga disesuaikan ke titik kewajaran, titik paling tepat dalam rentang, atau median kalau titik paling tepat tidak dapat ditentukan.", "s": "Slide 757–767", "kw": "rentang kewajaran", "rk": 1, "hit": "Bab 5 · 4.3 Kesebandingan, metode, dan rentang kewajaran", "nav": ["Beranda", "Bab 5", "Modul 4 · PP 20/2026 dan transfer pricing", "Pelajaran 4.3 “Kesebandingan, metode, dan rentang kewajaran”", "bagian “Menentukan angka wajar (Pasal 12)”, lihat juga “Internal vs eksternal” di Tahap 4"]}, {"b": 6, "q": "Dalam satu tahun, PT Galaksi: (1) mengubah tahun bukunya dari Juli–Juni menjadi Januari–Desember; (2) melakukan revaluasi aktiva tetap; dan (3) menyampaikan SPT PPN lebih bayar yang dikompensasikan ke masa berikutnya, tanpa meminta restitusi. Kriteria pemeriksaan untuk menguji kepatuhan (Pasal 4 ayat 1 PMK-15/2025) yang terpenuhi adalah …", "o": ["Huruf e dan g saja, karena kompensasi bukan permohonan restitusi", "Huruf f, g, dan a", "Huruf h dan b, karena perubahan tahun buku termasuk restrukturisasi", "Huruf e, g, dan b"], "a": 3, "e": "Pasal 4 ayat (1): perubahan tahun buku (huruf e) dan revaluasi aktiva tetap (huruf g) adalah kriteria tersendiri. SPT lebih bayar selain yang meminta pengembalian Pasal 17B (misalnya dikompensasikan) adalah huruf b. Huruf a untuk permohonan restitusi Pasal 17B, huruf f untuk perubahan metode pembukuan, dan huruf h untuk merger, pemekaran, likuidasi, dan sejenisnya.", "s": "Slide 816, 824", "kw": "perubahan tahun buku", "rk": 1, "hit": "Bab 6 · 1.1 Kriteria pemeriksaan untuk menguji kepatuhan (a–n)", "nav": ["Beranda", "Bab 6", "Modul 1 · Kriteria pemeriksaan", "Pelajaran 1.1 “Kriteria pemeriksaan untuk menguji kepatuhan (a–n)”", "bagian pembuka pelajaran, tabel “Lebih bayar & rugi” dan “Perubahan WP”"]}, {"b": 6, "q": "Dua perusahaan perkebunan diusulkan untuk diperiksa. PT Sawo tidak menyampaikan SPOP, sudah ditegur secara tertulis, dan tetap tidak menyampaikannya sampai batas waktu dalam teguran. PT Duku menyampaikan SPOP tepat waktu, tetapi hasil analisis citra satelit menunjukkan luas areal tertanamnya jauh lebih besar. Kriteria pemeriksaannya masing-masing adalah …", "o": ["PT Sawo huruf m; PT Duku huruf n", "PT Sawo huruf n; PT Duku huruf m", "PT Sawo huruf m; PT Duku huruf l (data konkret)", "Keduanya huruf j, karena dipilih berdasarkan risiko kepatuhan"], "a": 0, "e": "Ada dua kriteria khusus PBB: huruf m (SPOP tidak disampaikan dan, setelah ditegur tertulis, tetap tidak disampaikan dalam waktu yang ditentukan) dan huruf n (ada indikasi PBB terutang lebih besar daripada yang dihitung dari SPOP, berdasarkan data, keterangan, bukti, dan hasil analisis). Citra satelit adalah data analisis, bukan data konkret yang cukup diuji sederhana.", "s": "Slide 816, 824", "kw": "SPOP", "rk": 3, "hit": "Bab 6 · 1.1 Kriteria pemeriksaan untuk menguji kepatuhan (a–n)", "nav": ["Beranda", "Bab 6", "Modul 1 · Kriteria pemeriksaan", "Pelajaran 1.1 “Kriteria pemeriksaan untuk menguji kepatuhan (a–n)”", "bagian pembuka pelajaran, tabel “PBB” (huruf m dan n)"]}, {"b": 6, "q": "KPP menerima tiga kebutuhan pemeriksaan: (1) PT Prima menyampaikan SPT PPh Badan rugi; (2) PT Lumbung mengajukan permohonan MAP karena dipajaki ganda oleh negara mitra P3B; (3) DJP perlu menentukan di mana saja tempat PPN terutang PT Raya yang punya banyak lokasi. Jenis pemeriksaan yang tepat adalah …", "o": ["(1) tujuan lain; (2) menguji kepatuhan; (3) tujuan lain", "(1) menguji kepatuhan; (2) menguji kepatuhan; (3) tujuan lain", "(1) menguji kepatuhan; (2) tujuan lain; (3) menguji kepatuhan", "(1) menguji kepatuhan; (2) tujuan lain; (3) tujuan lain"], "a": 3, "e": "SPT rugi adalah kriteria pemeriksaan menguji kepatuhan (Pasal 4 ayat 1 huruf c). Penyelesaian MAP (huruf q, baru) dan penentuan satu atau lebih tempat terutang PPN (huruf l) termasuk pemeriksaan untuk tujuan lain, yang mengumpulkan fakta untuk keputusan administratif, bukan menguji jumlah pajak.", "s": "Slide 817", "kw": "tujuan lain", "rk": 1, "hit": "Bab 6 · 1.2 Kriteria pemeriksaan untuk tujuan lain (a–y)", "nav": ["Beranda", "Bab 6", "Modul 1 · Kriteria pemeriksaan", "Pelajaran 1.2 “Kriteria pemeriksaan untuk tujuan lain (a–y)”", "bagian pembuka pelajaran"]}, {"b": 6, "q": "Pemeriksaan terfokus atas PT Kirana dimulai dengan penyampaian Surat Pemberitahuan Pemeriksaan pada 2 Maret. PT Kirana bukan anggota grup dan tidak punya indikasi transfer pricing maupun rekayasa transaksi. Karena PT Kirana lambat menyerahkan dokumen, pemeriksa ingin memperpanjang tahap pengujian dua bulan. Penilaian yang tepat adalah …", "o": ["Dapat diperpanjang paling lama 4 bulan, karena WP tidak kooperatif menyerahkan dokumen", "Tidak bisa diperpanjang; pengujian maks. 3 bulan const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const inl = s => esc(s).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>");
function fmt(t){
  return t.split(/\n\n+/).map(block => {
    const lines = block.split("\n");
    const out = []; let ul = null;
    lines.forEach(ln => {
      if(/^- /.test(ln)){ if(!ul){ ul=[]; } ul.push("<li>"+inl(ln.slice(2))+"</li>"); }
      else { if(ul){ out.push("<ul>"+ul.join("")+"</ul>"); ul=null; } if(ln.trim()) out.push("<p>"+inl(ln)+"</p>"); }
    });
    if(ul) out.push("<ul>"+ul.join("")+"</ul>");
    return out.join("");
  }).join("");
}

// hash: #soal-12

function counts(){ let ok=0, no=0; for(const k in S.ans){ const i=+k; if(Q[i]){ if(S.ans[k]===Q[i].a) ok++; else no++; } } return {ok, no}; }
function updateTop(){

function render(scrollTop){

function answer(j){

  S.ans[i] = j; save(); render(false);
  const v = $("verdict");

    const navH = $("next").closest(".nav").getBoundingClientRect().height;

    }
  }
}

}

  if(c){
    const kw = c.dataset.kw;
    const done = () => { c.textContent = "Tersalin"; setTimeout(()=>{ c.textContent = "Salin"; }, 1400); };
    const fallback = () => { const code = c.previousElementSibling; try{ const rg = document.createRange(); rg.selectNodeContents(code); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(rg); c.textContent = "Terpilih"; setTimeout(()=>{ c.textContent = "Salin"; }, 1400); }catch(err){} };
    try{ navigator.clipboard.writeText(kw).then(done, fallback); }catch(err){ fallback(); }
  }
});
$("prev").addEventListener("click", () => go(S.cur-1));
$("next").addEventListener("click", () => { if(S.cur===Q.length-1) openSheet(); else go(S.cur+1); });

// ---------- lembar daftar soal ----------
let armed = false;
function sheetHTML(){
  const c = counts(), n = c.ok+c.no;
  let h = '<div class="sh-top"><div><h2 id="shT">Daftar soal</h2><p class="lead">100 soal kasus berlapis, 6 bab. Ketuk nomor untuk melompat.</p></div><button class="x" id="closeSheet" aria-label="Tutup">✕</button></div>';
  h += '<div class="score"><div><b>'+n+'</b><span>dijawab</span></div><div class="g"><b>'+c.ok+'</b><span>benar</span></div><div class="r"><b>'+c.no+'</b><span>salah</span></div><div><b>'+(n?Math.round(c.ok/n*100):0)+'%</b><span>ketepatan</span></div></div>';
  for(const b of [1,2,3,4,5,6]){
    const idx = Q.map((q,i)=>q.b===b?i:-1).filter(i=>i>=0);
    let ok=0, ans=0; idx.forEach(i=>{ if(S.ans[i]!==undefined){ ans++; if(S.ans[i]===Q[i].a) ok++; } });
    h += '<div class="babh"><b>Bab '+b+'</b><span>'+esc(BAB[b])+'</span><em>'+ok+'/'+ans+' benar · '+idx.length+' soal</em></div><div class="cells">';
    idx.forEach(i=>{
      const a = S.ans[i]; let cls = "cell";
      if(a!==undefined) cls += a===Q[i].a ? " ok" : " no";
      if(i===S.cur) cls += " cur";
      h += '<button class="'+cls+'" data-go="'+i+'" aria-label="Soal '+(i+1)+'">'+(i+1)+'</button>';
    });
    h += '</div>';
  }
  h += '<div class="legend"><span><i class="lo"></i>benar</span><span><i class="ln"></i>salah</span><span><i></i>belum dijawab</span></div>';
  h += '<div class="reset">'+(armed
      ? '<span>Hapus semua jawaban dan mulai dari soal 1?</span><button class="danger" id="doReset">Ya, hapus</button><button id="noReset">Batal</button>'
      : '<button id="askReset">Mulai ulang</button><span>Jawaban tersimpan di peramban ini.</span>')+'</div>';
  h += '<p class="keys">Pintasan: <kbd>A</kbd>–<kbd>D</kbd> atau <kbd>1</kbd>–<kbd>4</kbd> menjawab · <kbd>←</kbd> <kbd>→</kbd> pindah soal · <kbd>G</kbd> daftar soal</p>';
  return h;
}
function openSheet(){ armed=false; $("sheet").innerHTML = sheetHTML(); $("sheet").hidden = false; $("scrim").hidden = false; const x=$("closeSheet"); if(x) x.focus(); }
function closeSheet(){ $("sheet").hidden = true; $("scrim").hidden = true; }
$("openGrid").addEventListener("click", openSheet);
$("pos").addEventListener("click", openSheet);
$("scrim").addEventListener("click", closeSheet);
$("sheet").addEventListener("click", e => {
  const t = e.target;
  if(t.closest("#closeSheet")){ closeSheet(); return; }
  const g = t.closest("[data-go]"); if(g){ closeSheet(); go(+g.dataset.go); return; }
  if(t.closest("#askReset")){ armed = true; $("sheet").innerHTML = sheetHTML(); return; }
  if(t.closest("#noReset")){ armed = false; $("sheet").innerHTML = sheetHTML(); return; }
  if(t.closest("#doReset")){ S = {ans:{}, cur:0}; save(); armed=false; closeSheet(); toHash(); render(true); }
});

document.addEventListener("keydown", e => {
  if(e.metaKey || e.ctrlKey || e.altKey) return;
  const open = !$("sheet").hidden;
  if(e.key==="Escape" && open){ closeSheet(); return; }
  if(open) return;
  const k = e.key.toLowerCase();
  const map = {a:0,b:1,c:2,d:3,"1":0,"2":1,"3":2,"4":3};
  if(k in map){ answer(map[k]); e.preventDefault(); }
  else if(e.key==="ArrowRight"){ if(S.cur<Q.length-1) go(S.cur+1); e.preventDefault(); }
  else if(e.key==="ArrowLeft"){ go(S.cur-1); e.preventDefault(); }
  else if(k==="g"){ openSheet(); e.preventDefault(); }
});
window.addEventListener("hashchange", () => { const before = S.cur; fromHash(); if(S.cur!==before){ save(); render(true); } });

fromHash(); render(true);
})();
</script>
